<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - Kalimat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090a0f;
            --bg-card: #12141c;
            --bg-input: #1a1d28;
            --border-color: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-white: #ffffff;
            --accent-danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(9, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--bg-input);
        }

        .avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #262a3b;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .avatar-circle:active {
            transform: scale(0.92);
        }

        /* View Panels */
        .view-panel {
            display: none;
            padding: 16px;
        }

        .view-panel.active {
            display: block;
        }

        /* Publisher Card */
        .composer-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .composer-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 48px;
        }

        .composer-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }

        .tool-icons {
            display: flex;
            gap: 14px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .tool-icons span {
            cursor: pointer;
            transition: color 0.15s;
        }

        .tool-icons span:hover {
            color: var(--text-main);
        }

        /* Pure Symbol Action Button */
        .btn-action-symbol {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-action-symbol:active {
            transform: scale(0.88);
            opacity: 0.8;
        }

        /* Posts */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }

        .post-card:hover {
            border-color: var(--border-hover);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-author-name {
            font-size: 14px;
            font-weight: 600;
        }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-right: auto;
        }

        .post-body {
            font-size: 13.5px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .post-actions-bar {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 13px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .action-btn:active {
            transform: scale(0.9);
            background: var(--bg-input);
            color: var(--text-main);
        }

        /* Settings View */
        .field-label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-box {
            display: flex;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .input-box input {
            width: 100%;
            background: none;
            border: none;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
            direction: ltr;
        }

        .btn-symbol-chip {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-symbol-chip:active {
            color: var(--text-main);
        }

        .btn-block-main {
            width: 100%;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.15s;
        }

        .btn-block-main:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .btn-block-sub {
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.15s;
        }

        .btn-block-sub:active {
            transform: scale(0.97);
            background: var(--bg-input);
        }

        .btn-block-danger {
            width: 100%;
            background: transparent;
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.15s;
        }

        .btn-block-danger:active {
            transform: scale(0.97);
            background: rgba(239, 68, 68, 0.1);
        }

        .status-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #34d399;
            margin-top: 14px;
        }

        /* Minimal Bottom Dock */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            background: rgba(9, 10, 15, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .dock-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dock-btn.active {
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .dock-btn:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- Header -->
        <header class="app-header">
            <button class="icon-btn" type="button" onclick="switchTab('settings')">⚙</button>
            <div class="logo-title">كلمات</div>
            <div class="avatar-circle" onclick="switchTab('settings')">K</div>
        </header>

        <!-- View 1: Feed -->
        <main id="feed-view" class="view-panel active">
            <div class="composer-box">
                <textarea class="composer-input" placeholder="اكتب شيئاً..."></textarea>
                <div class="composer-toolbar">
                    <div class="tool-icons">
                        <span>📷</span>
                        <span>📍</span>
                        <span>🏷</span>
                    </div>
                    <!-- رمز بدلاً من كلمة نشر -->
                    <button class="btn-action-symbol" type="button">➔</button>
                </div>
            </div>

            <div class="post-card">
                <div class="post-meta">
                    <div class="avatar-circle">Y</div>
                    <div>
                        <div class="post-author-name">Yasser Al-Hussein</div>
                    </div>
                    <div class="post-time">5m</div>
                </div>
                <div class="post-body">
                    تم تبسيط الواجهة بالكامل واستبعاد كافة الألوان والتفاصيل غير الضرورية للتركيز على المحتوى بسرعة واستجابة عالية.
                </div>
                <div class="post-actions-bar">
                    <button class="action-btn" type="button">💬 12</button>
                    <button class="action-btn" type="button">🔄 4</button>
                    <button class="action-btn" type="button">♡ 28</button>
                    <button class="action-btn" type="button">⚡ 15</button>
                </div>
            </div>

            <div class="post-card">
                <div class="post-meta">
                    <div class="avatar-circle">K</div>
                    <div>
                        <div class="post-author-name">كلمات</div>
                    </div>
                    <div class="post-time">الآن</div>
                </div>
                <div class="post-body">
                    منصة هادئة ومينيمالية بدون ألوان صبيانية أو إزعاج بصري.
                </div>
                <div class="post-actions-bar">
                    <button class="action-btn" type="button">💬 2</button>
                    <button class="action-btn" type="button">🔄 1</button>
                    <button class="action-btn" type="button">♡ 9</button>
                    <button class="action-btn" type="button">⚡ 5</button>
                </div>
            </div>
        </main>

        <!-- View 2: Settings -->
        <main id="settings-view" class="view-panel">
            <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px;">
                <label class="field-label">PUBLIC KEY (npub)</label>
                <div class="input-box">
                    <input type="text" id="pub-key" readonly placeholder="npub...">
                    <button class="btn-symbol-chip" type="button" onclick="copyKey('pub-key')">📋</button>
                </div>

                <label class="field-label">PRIVATE KEY (nsec)</label>
                <div class="input-box">
                    <input type="text" id="priv-key" placeholder="nsec...">
                    <button class="btn-symbol-chip" type="button" onclick="copyKey('priv-key')">📋</button>
                </div>

                <button class="btn-block-main" type="button" onclick="handleGenerate(event)">توليد مفاتيح جديدة</button>
                <button class="btn-block-sub" type="button" onclick="handleLogin(event)">دخول بالمفتاح</button>
                <button class="btn-block-danger" id="logout-btn" type="button" onclick="handleLogout(event)" style="display:none;">خروج</button>

                <div class="status-tag" id="status-tag" style="display:none;">
                    ● الجلسة نشطة وموقعة
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Dock -->
        <nav class="bottom-dock">
            <button class="dock-btn active" id="nav-feed" type="button" onclick="switchTab('feed')">⌂</button>
            <button class="dock-btn" type="button">💬</button>
            <button class="dock-btn" type="button">🔔</button>
            <button class="dock-btn" id="nav-settings" type="button" onclick="switchTab('settings')">⚙</button>
        </nav>
    </div>

    <script>
        window.addEventListener('load', () => {
            const savedPriv = localStorage.getItem('kalimat_priv');
            const savedPub = localStorage.getItem('kalimat_pub');
            if (savedPriv && savedPub) {
                document.getElementById('priv-key').value = savedPriv;
                document.getElementById('pub-key').value = savedPub;
                updateAuthUI(true);
            }
        });

        function switchTab(tabName) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'feed') {
                document.getElementById('feed-view').classList.add('active');
                document.getElementById('nav-feed').classList.add('active');
            } else if (tabName === 'settings') {
                document.getElementById('settings-view').classList.add('active');
                document.getElementById('nav-settings').classList.add('active');
            }
        }

        function handleGenerate(e) {
            if (e) e.preventDefault();
            const hex = [...Array(64)].map(() => Math.floor(Math.random() * 16).toString(16)).join('');
            
            document.getElementById('priv-key').value = 'nsec1' + hex.substring(0, 30);
            document.getElementById('pub-key').value = 'npub1' + hex.substring(0, 30);

            localStorage.setItem('kalimat_priv', document.getElementById('priv-key').value);
            localStorage.setItem('kalimat_pub', document.getElementById('pub-key').value);

            updateAuthUI(true);
        }

        function handleLogin(e) {
            if (e) e.preventDefault();
            const val = document.getElementById('priv-key').value.trim();
            if (!val) return;

            const pub = 'npub1' + (val.startsWith('nsec1') ? val.substring(5) : val);
            document.getElementById('pub-key').value = pub;

            localStorage.setItem('kalimat_priv', val);
            localStorage.setItem('kalimat_pub', pub);

            updateAuthUI(true);
            switchTab('feed');
        }

        function handleLogout(e) {
            if (e) e.preventDefault();
            localStorage.removeItem('kalimat_priv');
            localStorage.removeItem('kalimat_pub');

            document.getElementById('priv-key').value = '';
            document.getElementById('pub-key').value = '';

            updateAuthUI(false);
        }

        function updateAuthUI(isLoggedIn) {
            document.getElementById('status-tag').style.display = isLoggedIn ? 'flex' : 'none';
            document.getElementById('logout-btn').style.display = isLoggedIn ? 'block' : 'none';
        }

        function copyKey(id) {
            const input = document.getElementById(id);
            if (input && input.value) {
                navigator.clipboard.writeText(input.value);
            }
        }
    </script>
</body>
</html>
