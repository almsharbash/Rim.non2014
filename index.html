<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلمات - Nostr</title>
    <style>
        :root {
            --bg-color: #0d1322;
            --card-bg: #161f33;
            --text-color: #f1f5f9;
            --text-secondary: #94a3b8;
            --primary: #2563eb;
            --primary-glow: #38bdf8;
            --gold: #f59e0b;
            --border-color: #243049;
            --input-bg: #0f172a;
            --like-red: #ef4444;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-glow: #0284c7;
            --gold: #d97706;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
        }

        .logo-box h1 {
            font-size: 22px;
            margin: 0;
            color: var(--primary-glow);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .status {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .create-post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary-glow);
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--gold);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .publish-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 9px 22px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            word-break: break-word;
        }

        .post-author {
            font-size: 12px;
            color: var(--primary-glow);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .post-content {
            font-size: 15px;
            line-height: 1.6;
        }

        .post-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .interaction-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn.liked {
            color: var(--like-red);
        }

        /* قسم التعليقات */
        .comments-section {
            display: none;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .comment-input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .comment-input-box input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .comment-input-box button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .comment-item {
            background-color: var(--input-bg);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 6px;
            border: 1px solid var(--border-color);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/almsharbash/Rim.non2014/main/1000224814.png" alt="كلمات" onerror="this.style.display='none'">
                <h1>كلمات</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="alert('لا توجد إشعارات جديدة حالياً')">🔔 الإشعارات</button>
                <button class="icon-btn" onclick="toggleTheme()">☀️/🌙</button>
            </div>
        </header>

        <div id="status" class="status">جاري الاتصال بشبكة Nostr...</div>

        <div class="create-post-card">
            <textarea id="postInput" placeholder="اكتب كلمتك هنا..."></textarea>
            <div class="post-actions">
                <label class="file-upload-btn">
                    📷 إضافة صورة من المعرض
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
                </label>
                <button class="publish-btn" onclick="publishPost()">نشر 🪶</button>
            </div>
            <div id="uploadStatus" style="font-size: 12px; color: var(--gold); margin-top: 6px;"></div>
        </div>

        <div id="feed"></div>
    </div>

    <script>
        const relayUrl = 'wss://relay.damus.io';
        const socket = new WebSocket(relayUrl);
        const statusDiv = document.getElementById('status');
        const feedDiv = document.getElementById('feed');
        let selectedImageUrl = "";

        socket.onopen = () => {
            statusDiv.innerText = 'تم الاتصال بنجاح! جاري جلب أحدث المنشورات...';
            statusDiv.style.color = '#10b981';

            const request = JSON.stringify([
                "REQ", "main-feed",
                { kinds: [1], limit: 15 }
            ]);
            socket.send(request);
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data[0] === "EVENT") {
                displayPost(data[2]);
            }
        };

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.innerText = "جاري رفع الصورة...";

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch("https://api.imgbb.com/1/upload?key=6d2578358390b31355e1017e29f3426a", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (result && result.data && result.data.url) {
                    selectedImageUrl = result.data.url;
                    uploadStatus.innerText = "تم إرفاق الصورة بنجاح! ✅";
                } else {
                    uploadStatus.innerText = "تعذر رفع الصورة، يمكنك إدراج رابط الصورة مباشرة.";
                }
            } catch (err) {
                uploadStatus.innerText = "حدث خطأ أثناء الاتصال بخادم الصور.";
            }
        }

        function displayPost(event) {
            const card = document.createElement('div');
            card.className = 'post-card';
            
            const author = document.createElement('div');
            author.className = 'post-author';
            author.innerText = `ناشر: ${event.pubkey ? event.pubkey.substring(0, 10) : "مستخدم"}...`;

            const content = document.createElement('div');
            content.className = 'post-content';
            
            let text = event.content || "";
            const imgRegex = /(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/i;
            const match = text.match(imgRegex);

            if (match) {
                text = text.replace(match[0], '');
                content.innerText = text;
                const img = document.createElement('img');
                img.src = match[0];
                img.className = 'post-image';
                content.appendChild(img);
            } else {
                content.innerText = text;
            }

            const postId = 'post-' + Math.random().toString(36).substr(2, 9);

            const actionBar = document.createElement('div');
            actionBar.className = 'interaction-bar';
            actionBar.innerHTML = `
                <button class="action-btn" onclick="toggleLike(this)">❤️ إعجاب</button>
                <button class="action-btn" onclick="toggleCommentBox('${postId}')">💬 تعليق</button>
                <button class="action-btn" onclick="alert('تم إعادة النشر بنجاح!')">🔁 إعادة نشر</button>
                <button class="action-btn" onclick="sharePost()">🔗 مشاركة</button>
            `;

            const commentsSection = document.createElement('div');
            commentsSection.className = 'comments-section';
            commentsSection.id = postId;
            commentsSection.innerHTML = `
                <div class="comment-input-box">
                    <input type="text" placeholder="اكتب تعليقك..." id="input-${postId}">
                    <button onclick="addComment('${postId}')">إرسال</button>
                </div>
                <div id="list-${postId}"></div>
            `;

            card.appendChild(author);
            card.appendChild(content);
            card.appendChild(actionBar);
            card.appendChild(commentsSection);
            feedDiv.prepend(card);
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            btn.innerText = btn.classList.contains('liked') ? '❤️ أعجبك' : '❤️ إعجاب';
        }

        function toggleCommentBox(id) {
            const sec = document.getElementById(id);
            sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
        }

        function addComment(id) {
            const input = document.getElementById(`input-${id}`);
            const list = document.getElementById(`list-${id}`);
            if (!input.value.trim()) return;

            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerText = input.value;
            list.appendChild(item);
            input.value = '';
        }

        function sharePost() {
            if (navigator.share) {
                navigator.share({ title: 'منصة كلمات', url: window.location.href });
            } else {
                alert('تم نسخ رابط المنصة!');
            }
        }

        function publishPost() {
            const input = document.getElementById('postInput');
            let contentText = input.value.trim();

            if (selectedImageUrl) {
                contentText += "\n" + selectedImageUrl;
            }

            if (!contentText) {
                alert("يرجى كتابة نص أو إرفاق صورة أولاً.");
                return;
            }

            const dummyEvent = {
                pubkey: "أنت (المستخدم الحالي)",
                content: contentText
            };
            displayPost(dummyEvent);

            input.value = "";
            document.getElementById('uploadStatus').innerText = "";
            selectedImageUrl = "";
        }
    </script>
</body>
</html>
