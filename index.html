<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كلمات | Kalimat</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/99VxKqb7/1789866824772.png">
    <meta property="og:title" content="منصة كلمات - Kalimat" />
    <meta property="og:description" content="منصة تواصل حر ومستقل عبر بروتوكول Nostr." />
    <meta property="og:image" content="https://i.ibb.co/99VxKqb7/1789866824772.png" />
    <meta property="og:type" content="website" />

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-secondary: #151a23;
            --bg-card: #1c2331;
            --border-color: #2a3447;
            --accent-color: #8b5cf6;
            --btn-blue: #1d9bf0;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #111827;
        }

        body.light-theme {
            --bg-main: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #f1f5f9;
            --border-color: #e2e8f0;
            --accent-color: #7c3aed;
            --btn-blue: #1d9bf0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 70px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        .app-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-main);
            opacity: 0.96;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .feather-logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .user-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
            cursor: pointer;
            object-fit: cover;
            overflow: hidden;
        }

        .user-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Primal-style Quick Box */
        .composer-trigger-box {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
        }

        .composer-trigger-placeholder {
            color: var(--text-muted);
            font-size: 15px;
            flex: 1;
        }

        .post-card {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .post-content { flex: 1; }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .author-name { font-weight: 700; font-size: 15px; }
        .author-handle { color: var(--text-muted); font-size: 12px; margin-right: 4px; }
        .post-time { color: var(--text-muted); font-size: 11px; }

        .post-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
            margin: 6px 0 10px 0;
            white-space: pre-wrap;
        }

        .post-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            max-height: 300px;
            object-fit: cover;
        }

        .post-actions-clean {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            padding-top: 6px;
            max-width: 340px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .action-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .fab-btn {
            position: fixed;
            bottom: 75px;
            left: 20px;
            background-color: var(--btn-blue);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(29, 155, 240, 0.4);
            border: none;
            cursor: pointer;
            z-index: 99;
        }

        .fab-btn svg { width: 24px; height: 24px; fill: white; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-main);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-button.active { color: var(--accent-color); }
        .nav-button svg { width: 24px; height: 24px; fill: currentColor; }

        /* Primal Fullscreen Composer Modal */
        .primal-composer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-main);
            z-index: 3000;
            flex-direction: column;
            padding: 12px 16px;
        }

        .primal-composer-modal.active { display: flex; }

        .composer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .composer-close-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
        }

        .btn-post-primal {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .composer-body {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            flex: 1;
        }

        .composer-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            resize: none;
            min-height: 150px;
        }

        .composer-toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            color: var(--btn-blue);
        }

        .composer-tool-btn {
            background: none;
            border: none;
            color: var(--btn-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .composer-tool-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .setting-card { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .setting-card-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; color: var(--accent-color); }

        .input-field {
            width: 100%; padding: 11px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main);
            font-size: 13px; margin-top: 6px; outline: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white; border: none;
            padding: 10px 18px; border-radius: 8px;
            font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 10px; width: 100%;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px; border-radius: 8px;
            font-size: 14px; font-weight: 600;
            cursor: pointer; margin-top: 10px; width: 100%;
        }
    </style>
</head>
<body class="dark-theme">

    <header class="app-header">
        <div class="user-avatar-small global-avatar" onclick="switchTab('profile')">M</div>
        <div class="brand">
            <img src="https://i.ibb.co/99VxKqb7/1789866824772.png" alt="شعار كلمات" class="feather-logo-img">
            <span>كلمات</span>
        </div>
        <button class="nav-button" onclick="switchTab('settings')" style="width:auto;">
            <svg style="width:22px;height:22px;" viewBox="0 0 24 24"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.65.07-.97c0-.32-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .32.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg>
        </button>
    </header>

    <!-- 1. الرئيسية -->
    <main id="tab-feed" class="tab-content active">
        <div class="composer-trigger-box" onclick="openPrimalComposer()">
            <div class="user-avatar-small global-avatar">M</div>
            <div class="composer-trigger-placeholder">ماذا يدور في ذهنك؟</div>
        </div>

        <div id="posts-container">
            <div class="post-card">
                <div class="user-avatar-small" style="background:#3b82f6;">Y</div>
                <div class="post-content">
                    <div class="post-header">
                        <div>
                            <span class="author-name">ياسر الحسين</span>
                            <span class="author-handle">@yasser</span>
                        </div>
                        <span class="post-time">5 د</span>
                    </div>
                    <div class="post-text" id="post-text-demo">التصميم الجديد يعتمد بالكامل على الأيقونات والرموز السريعة مع إمكانية التبديل الفوري بين المظهر الداكن والمضيء! 🚀</div>
                    <div class="post-actions-clean">
                        <button class="action-icon-btn">💬 <span>12</span></button>
                        <button class="action-icon-btn">🔄 <span>4</span></button>
                        <button class="action-icon-btn" onclick="toggleLike(this)">❤️ <span class="like-count">45</span></button>
                        <button class="action-icon-btn" onclick="translatePost('post-text-demo')">🌐 ترجمة</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- واجهة النشر الكاملة (Primal Style Composer) -->
    <div id="primal-composer" class="primal-composer-modal">
        <div class="composer-header">
            <button class="composer-close-btn" onclick="closePrimalComposer()">✕</button>
            <button class="btn-post-primal" onclick="publishPostPrimal()">Post / نشر</button>
        </div>
        <div class="composer-body">
            <div class="user-avatar-small global-avatar">M</div>
            <textarea id="primal-text-input" class="composer-textarea" placeholder="ماذا يدور في ذهنك؟ اكتب منشورك هنا..."></textarea>
        </div>
        <div class="composer-toolbar">
            <button class="composer-tool-btn" onclick="attachImageURL()" title="إضافة صورة">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button class="composer-tool-btn" title="منشن">@</button>
            <button class="composer-tool-btn" title="استطلاع رأي">📊</button>
        </div>
    </div>

    <!-- باقي الشاشات -->
    <section id="tab-friends" class="tab-content">
        <div style="padding: 16px; font-weight:700; color:var(--accent-color);">👥 قائمة الأصدقاء</div>
    </section>

    <section id="tab-notifications" class="tab-content">
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">لا توجد إشعارات.</div>
    </section>

    <section id="tab-messages" class="tab-content">
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">المحادثات المشفرة هنا.</div>
    </section>

    <section id="tab-profile" class="tab-content">
        <div style="padding: 20px;">
            <h3 id="profile-name-display">المشاربش</h3>
            <p id="profile-handle-display" style="color:var(--text-muted);">@almsharbash</p>
        </div>
    </section>

    <!-- الإعدادات وإصلاح الحسابات -->
    <section id="tab-settings" class="tab-content">
        <div class="setting-card">
            <div class="setting-card-title">☀️ 🌙 مظهر الشاشة</div>
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" onclick="setTheme('dark')">الوضع الداكن 🌙</button>
                <button class="btn-secondary" onclick="setTheme('light')">الوضع المضيء ☀️</button>
            </div>
        </div>

        <div class="setting-card">
            <div class="setting-card-title">🔐 إدارة الحساب والمفاتيح</div>
            <label style="font-size:11px; color:var(--text-muted);">المفتاح العام (Public Key - npub):</label>
            <input type="text" id="setting-npub" class="input-field" placeholder="المفتاح العام">

            <label style="font-size:11px; color:var(--text-muted); margin-top:8px; display:block;">المفتاح الخاص (Private Key - nsec):</label>
            <input type="text" id="setting-nsec" class="input-field" placeholder="أدخل أو يلصق مفتاح nsec هنا">

            <div style="display:flex; gap:10px; margin-top:12px;">
                <button class="btn-primary" onclick="generateNewAccount()">توليد حساب جديد ✨</button>
                <button class="btn-secondary" onclick="saveLoginKey()">تسجيل دخول بالمفتاح 🔑</button>
            </div>
        </div>
    </section>

    <!-- زر القلم العائم -->
    <button class="fab-btn" onclick="openPrimalComposer()">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83l3.75 3.75l1.83-1.83z"/></svg>
    </button>

    <!-- شريط التنقل -->
    <nav class="bottom-nav">
        <button class="nav-button active" onclick="switchTab('feed', this)">🏠</button>
        <button class="nav-button" onclick="switchTab('friends', this)">👥</button>
        <button class="nav-button" onclick="switchTab('notifications', this)">🔔</button>
        <button class="nav-button" onclick="switchTab('messages', this)">💬</button>
        <button class="nav-button" onclick="switchTab('profile', this)">👤</button>
    </nav>

    <script>
        let attachedImageUrl = "";

        // توليد وتسجيل فوري
        function generateRandomBech32(prefix) {
            const charset = 'qpzry9x8gf2vh3456789abcdef023456789mnpwrz';
            let res = prefix + '1';
            for (let i = 0; i < 58; i++) res += charset.charAt(Math.floor(Math.random() * charset.length));
            return res;
        }

        function generateNewAccount() {
            const nsec = generateRandomBech32('nsec');
            const npub = generateRandomBech32('npub');
            document.getElementById('setting-nsec').value = nsec;
            document.getElementById('setting-npub').value = npub;
            localStorage.setItem('nostr_nsec', nsec);
            localStorage.setItem('nostr_npub', npub);
            alert('تم إنشاء الحساب بنجاح وتفعيله فوراً!');
        }

        function saveLoginKey() {
            const nsecVal = document.getElementById('setting-nsec').value.trim();
            if (nsecVal.startsWith('nsec1')) {
                const npubVal = generateRandomBech32('npub');
                document.getElementById('setting-npub').value = npubVal;
                localStorage.setItem('nostr_nsec', nsecVal);
                localStorage.setItem('nostr_npub', npubVal);
                alert('تم تسجيل الدخول وتفعيل الحساب بنجاح!');
            } else {
                alert('يرجى أدخال مفتاح خاص صحيح يبدأ بـ nsec1');
            }
        }

        // إدراج وفتح واجهة النشر الاحترافية
        function openPrimalComposer() {
            document.getElementById('primal-composer').classList.add('active');
            document.getElementById('primal-text-input').focus();
        }

        function closePrimalComposer() {
            document.getElementById('primal-composer').classList.remove('active');
            document.getElementById('primal-text-input').value = "";
            attachedImageUrl = "";
        }

        function attachImageURL() {
            const url = prompt("أدخل رابط الصورة (URL):");
            if (url) {
                attachedImageUrl = url;
                alert("تم إرفاق الصورة بنجاح!");
            }
        }

        function publishPostPrimal() {
            const text = document.getElementById('primal-text-input').value.trim();
            if (!text && !attachedImageUrl) return;

            const postsContainer = document.getElementById('posts-container');
            const newPostHtml = `
                <div class="post-card">
                    <div class="user-avatar-small global-avatar">M</div>
                    <div class="post-content">
                        <div class="post-header">
                            <div>
                                <span class="author-name">المشاربش</span>
                                <span class="author-handle">@almsharbash</span>
                            </div>
                            <span class="post-time">الآن</span>
                        </div>
                        <div class="post-text">${text}</div>
                        ${attachedImageUrl ? `<img src="${attachedImageUrl}" class="post-img" />` : ''}
                        <div class="post-actions-clean">
                            <button class="action-icon-btn">💬 <span>0</span></button>
                            <button class="action-icon-btn">🔄 <span>0</span></button>
                            <button class="action-icon-btn" onclick="toggleLike(this)">❤️ <span class="like-count">0</span></button>
                            <button class="action-icon-btn">🌐 ترجمة</button>
                        </div>
                    </div>
                </div>
            `;
            postsContainer.insertAdjacentHTML('afterbegin', newPostHtml);
            closePrimalComposer();
        }

        function translatePost(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText += "\n\n[ترجمة تلقائية]: " + el.innerText;
            }
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        function setTheme(theme) {
            if (theme === 'light') {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
            }
        }

        function toggleLike(btn) {
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            countSpan.textContent = count + 1;
        }
    </script>
</body>
</html>
