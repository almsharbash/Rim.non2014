<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلمات | Kalimat</title>
    <!-- مكتبة لتشفير وتوقيع الأحداث في الجوال تلقائياً -->
    <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #6200ee;
            --primary-hover: #3700b3;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 { color: #ffffff; margin: 0 0 5px 0; font-size: 1.8rem; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

        .publish-box, .key-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            background: #151515;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        textarea { height: 90px; resize: vertical; }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
        }

        .btn:hover { background: var(--primary-hover); }

        .controls { display: flex; gap: 10px; margin-bottom: 15px; }

        #status {
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            border-right: 3px solid var(--primary);
        }

        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .event-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة كلمات</h1>
        <p class="subtitle">شبكة تواصل حرة ومفتوحة عبر Nostr</p>
    </header>

    <!-- قسم إدخال المفتاح للجوال -->
    <div class="key-box">
        <label style="font-size:0.85rem; color:#aaa; display:block; margin-bottom:5px;">
            مفتاحك الخاص (nsec) للنشر من الجوال (يُحفظ في هاتفك فقط):
        </label>
        <input type="password" id="nsecKey" placeholder="nsec1..." onchange="saveKey()">
    </div>

    <!-- صندوق النشر -->
    <div class="publish-box">
        <textarea id="postContent" placeholder="ماذا يدور في ذهنك؟ (سيُضاف هاشتاج #كلمات تلقائياً)..."></textarea>
        <button class="btn" onclick="publishPost()">نشر الآن</button>
    </div>

    <!-- التحكم بالخوادم -->
    <div class="controls">
        <input type="text" id="relayUrl" value="wss://relay.primal.net" placeholder="رابط الـ Relay">
        <button class="btn" style="width: auto;" onclick="connectAndFetch()">تحديث</button>
    </div>

    <div id="status">الحالة: جاري الاتصال...</div>
    <div id="eventsContainer"></div>

    <script>
        let ws = null;

        // تحميل المفتاح المحفوظ سابقاً في الهاتف إن وجد
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('kalimat_nsec');
            if (savedKey) document.getElementById('nsecKey').value = savedKey;
            connectAndFetch();
        });

        function saveKey() {
            const key = document.getElementById('nsecKey').value.trim();
            if (key) localStorage.setItem('kalimat_nsec', key);
        }

        function connectAndFetch() {
            const relayUrl = document.getElementById('relayUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const container = document.getElementById('eventsContainer');

            if (ws) ws.close();

            container.innerHTML = '';
            statusDiv.textContent = 'جاري الاتصال بـ ' + relayUrl + '...';

            try {
                ws = new WebSocket(relayUrl);

                ws.onopen = () => {
                    statusDiv.textContent = 'تم الاتصال! جاري جلب منشورات #كلمات...';
                    const subId = "sub_" + Math.random().toString(36).substring(7);
                    
                    // جلب المنشورات العامة أو المنشورات بـ هاشتاج #كلمات
                    const req = ["REQ", subId, { kinds: [1], "#t": ["كلمات"], limit: 20 }];
                    ws.send(JSON.stringify(req));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data[0] === "EVENT") {
                        displayEvent(data[2]);
                    } else if (data[0] === "EOSE") {
                        statusDiv.textContent = 'تم جلب أحدث المنشورات.';
                    }
                };

                ws.onerror = () => {
                    statusDiv.textContent = 'فشل الاتصال بهذا الخادم، جرب خادم wss://relay.primal.net أو wss://nos.lol';
                };

            } catch (err) {
                statusDiv.textContent = 'الرابط غير صالح.';
            }
        }

        function displayEvent(eventData) {
            const container = document.getElementById('eventsContainer');
            if (document.getElementById("evt-" + eventData.id)) return;

            const card = document.createElement('div');
            card.className = 'event-card';
            card.id = "evt-" + eventData.id;

            const date = new Date(eventData.created_at * 1000).toLocaleString('ar-EG');
            const pubShort = eventData.pubkey.substring(0, 8) + "...";

            card.innerHTML = `
                <div class="event-header">
                    <span><strong>الناشر:</strong> ${pubShort}</span>
                    <span>${date}</span>
                </div>
                <div>${escapeHtml(eventData.content)}</div>
            `;
            container.appendChild(card);
        }

        async function publishPost() {
            const text = document.getElementById('postContent').value.trim();
            const nsec = document.getElementById('nsecKey').value.trim();

            if (!text) return alert("اكتب شيئاً للنشر!");

            let signedEvent = null;

            // 1. تجربة النشر بالمفتاح الخاص (للجوال)
            if (nsec) {
                try {
                    let sk = nsec;
                    if (nsec.startsWith('nsec')) {
                        let { type, data } = NostrTools.nip19.decode(nsec);
                        sk = data;
                    }
                    const pk = NostrTools.getPublicKey(sk);
                    
                    let event = {
                        kind: 1,
                        created_at: Math.floor(Date.now() / 1000),
                        tags: [["t", "كلمات"]],
                        content: text,
                        pubkey: pk
                    };

                    event.id = NostrTools.getEventHash(event);
                    event.sig = NostrTools.signEvent(event, sk);
                    signedEvent = event;
                } catch (e) {
                    return alert("المفتاح الخاص (nsec) غير صحيح!");
                }
            } 
            // 2. تجربة النشر بإضافة المتصفح (للحواسيب)
            else if (typeof window.nostr !== 'undefined') {
                try {
                    const pubkey = await window.nostr.getPublicKey();
                    const event = {
                        kind: 1,
                        created_at: Math.floor(Date.now() / 1000),
                        tags: [["t", "كلمات"]],
                        content: text,
                        pubkey: pubkey
                    };
                    signedEvent = await window.nostr.signEvent(event);
                } catch (e) {
                    return alert("تم إلغاء التوقيع من الإضافة.");
                }
            } else {
                return alert("يرجى إدخال مفتاحك الخاص (nsec) في الصندوق العلوي للنشر من الجوال!");
            }

            // إرسال المنشور الموقّع
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(["EVENT", signedEvent]));
                alert("تم النشر بنجاح!");
                document.getElementById('postContent').value = '';
                displayEvent(signedEvent);
            } else {
                alert("الخادم غير متصل حالياً.");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
