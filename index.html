<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات | Kalimat</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; font-family: 'Tajawal', sans-serif; color: #1c1e21; }

        /* --- صفحة التسجيل والدخول --- */
        #login-page {
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .header-container { text-align: center; margin-bottom: 20px; }
        .logo-img { width: 110px; height: auto; display: block; margin: 0 auto 5px auto; mix-blend-mode: multiply; }
        .app-title { color: #0b4395; font-family: 'Aref Ruqaa', serif; font-size: 48px; font-weight: 700; }
        .app-desc { color: #555; font-size: 15px; max-width: 320px; }
        .card { background: #ffffff; width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 15px; }
        .input-field { width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; font-family: 'Tajawal', sans-serif; }
        .btn-primary { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }
        .btn-secondary { width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .forgot-pass { display: block; text-align: center; margin: 15px 0; color: #1a73e8; text-decoration: none; font-size: 14px; }
        .divider { height: 1px; background-color: #e0e0e0; margin: 20px 0; }

        /* --- النوافذ المنبثقة --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card { background: #fff; width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 24px; color: #888; cursor: pointer; }
        .row-inputs { display: flex; gap: 10px; }

        /* --- واجهة المنصة --- */
        #app-layout { display: none; }
        
        .top-navbar {
            background: #ffffff; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .nav-logo { font-family: 'Aref Ruqaa', serif; font-size: 28px; color: #0b4395; text-decoration: none; font-weight: bold; }
        .search-box { background: #f0f2f5; border-radius: 20px; padding: 8px 16px; border: none; outline: none; width: 40%; font-family: 'Tajawal', sans-serif; }
        .nav-icons { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #0b4395; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }

        .main-container { max-width: 700px; margin: 20px auto; padding: 0 10px; }

        /* --- الواجهة الشخصية --- */
        #profile-view { display: none; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .cover-photo { height: 160px; background: linear-gradient(135deg, #0b4395, #1a73e8); position: relative; }
        .profile-header-info { padding: 0 20px 20px 20px; position: relative; text-align: center; }
        .profile-avatar-large { width: 100px; height: 100px; border-radius: 50%; background: #0b4395; color: white; font-size: 36px; display: flex; align-items: center; justify-content: center; border: 4px solid #fff; margin: -50px auto 10px auto; }
        .profile-name { font-size: 22px; font-weight: bold; }
        .profile-bio { color: #666; font-size: 14px; margin-top: 5px; }
        .profile-nav-btns { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-outline { padding: 8px 16px; border: 1px solid #1a73e8; color: #1a73e8; background: transparent; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Tajawal', sans-serif; }

        /* --- صندوق إنشاء المنشور والمنشورات --- */
        .post-creator { background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .creator-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .creator-input { width: 100%; border: none; background: #f0f2f5; padding: 12px 16px; border-radius: 20px; outline: none; font-family: 'Tajawal', sans-serif; }
        .creator-actions { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .action-btn { background: none; border: none; color: #555; font-size: 14px; cursor: pointer; font-family: 'Tajawal', sans-serif; }

        .post-card { background: #ffffff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); padding: 15px; margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-author { font-weight: bold; font-size: 15px; }
        .post-time { font-size: 12px; color: #777; }
        .post-content { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
        .post-footer { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .interaction-btn { background: none; border: none; color: #65676b; font-weight: 500; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .liked { color: #1a73e8 !important; font-weight: bold; }

        .logout-btn { background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>

    <!-- 1. صفحة التسجيل والدخول -->
    <div id="login-page">
        <div class="header-container">
            <img src="https://i.ibb.co/99VxKqb7/1789866824772.png" alt="كلمات" class="logo-img">
            <h1 class="app-title">كلمات</h1>
            <p class="app-desc">تواصل مع الأصدقاء والعالم من حولك عبر المنصة في مكان واحد.</p>
        </div>

        <div class="card">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="email" id="loginEmail" class="input-field" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" class="input-field" placeholder="كلمة السر" required>
                </div>
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
            </form>
            <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>
            <div class="divider"></div>
            <button class="btn-secondary" onclick="openModal('registerModal')">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- 2. نافذة إنشاء حساب جديد -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">إنشاء حساب جديد</span>
                <button class="close-btn" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <form onsubmit="handleRegisterSubmit(event)">
                <div class="form-group row-inputs">
                    <input type="text" id="regFirstName" class="input-field" placeholder="الاسم الأول" required>
                    <input type="text" id="regLastName" class="input-field" placeholder="اسم العائلة" required>
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" class="input-field" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" class="input-field" placeholder="كلمة السر الجديدة" required>
                </div>
                <button type="submit" class="btn-secondary">تسجيل الحساب</button>
            </form>
        </div>
    </div>

    <!-- 3. واجهة التطبيق الرئيسية -->
    <div id="app-layout">
        <nav class="top-navbar">
            <a href="#" class="nav-logo" onclick="showFeedView()">كلمات</a>
            <input type="text" class="search-box" placeholder="بحث في كلمات...">
            <div class="nav-icons">
                <button class="action-btn" onclick="showFeedView()">🏠 الرئيسية</button>
                <div class="user-avatar" id="navAvatar" onclick="showProfileView()">ك</div>
                <button class="logout-btn" onclick="handleLogout()">خروج</button>
            </div>
        </nav>

        <div class="main-container">
            <div id="profile-view">
                <div class="cover-photo"></div>
                <div class="profile-header-info">
                    <div class="profile-avatar-large" id="profileAvatarLarge">ك</div>
                    <div class="profile-name" id="profileNameDisplay">المستخدم</div>
                    <div class="profile-bio">مرحباً بكم في صفحتي الشخصية على منصة كلمات!</div>
                    <div class="profile-nav-btns">
                        <button class="btn-outline" onclick="showFeedView()">العودة للرئيسية</button>
                    </div>
                </div>
            </div>

            <div class="post-creator">
                <div class="creator-top">
                    <div class="user-avatar" id="creatorAvatar">ك</div>
                    <input type="text" id="postInput" class="creator-input" placeholder="بم تفكر يا صديقي؟">
                </div>
                <div class="creator-actions">
                    <button class="action-btn" onclick="addPost()" style="color:#1a73e8; font-weight:bold;">نشر المنشور</button>
                </div>
            </div>

            <div id="postsContainer"></div>
        </div>
    </div>

    <!-- ربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBznOsrwmvtWDFKTbqz3bFry94J7hJFn0c",
            authDomain: "gogo1982-2026.firebaseapp.com",
            projectId: "gogo1982-2026",
            storageBucket: "gogo1982-2026.firebasestorage.app",
            messagingSenderId: "79409104235",
            appId: "1:79409104235:web:5d7ad5dcda013b32f6f82e",
            measurementId: "G-5V553NQLDK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserData = user;
                updateUserDisplays(user.displayName || "مستخدم كلمات");
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('app-layout').style.display = 'block';
                loadRealtimePosts();
            } else {
                currentUserData = null;
                document.getElementById('login-page').style.display = 'flex';
                document.getElementById('app-layout').style.display = 'none';
            }
        });

        // تسجيل حساب جديد حقيقي
        window.handleRegisterSubmit = async function(e) {
            e.preventDefault();
            const fName = document.getElementById('regFirstName').value;
            const lName = document.getElementById('regLastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const fullName = fName + " " + lName;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: fullName });
                closeModal('registerModal');
                alert('تم إنشاء الحساب بنجاح وتسجيل دخولك تلقائياً!');
            } catch (error) {
                alert('خطأ في التسجيل: ' + error.message);
            }
        };

        // تسجيل دخول حقيقي
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('خطأ في تسجيل الدخول: البريد أو كلمة السر غير صحيحة');
            }
        };

        // تسجيل الخروج
        window.handleLogout = function() {
            signOut(auth);
        };

        // إضافة منشور حقيقي لقاعدة البيانات
        window.addPost = async function() {
            const input = document.getElementById('postInput');
            if (!input.value.trim() || !currentUserData) return;

            try {
                await addDoc(collection(db, "posts"), {
                    author: currentUserData.displayName || "مستخدم",
                    content: input.value,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (error) {
                alert('خطأ أثناء النشر: ' + error.message);
            }
        };

        // جلب المنشورات لحظياً من السحابة
        function loadRealtimePosts() {
            const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(postsQuery, (snapshot) => {
                const postsContainer = document.getElementById('postsContainer');
                postsContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const letter = post.author ? post.author.charAt(0) : 'ك';
                    
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post-card';
                    postDiv.innerHTML = `
                        <div class="post-header">
                            <div class="user-avatar">${letter}</div>
                            <div>
                                <div class="post-author">${post.author}</div>
                                <div class="post-time">منشور سحابي</div>
                            </div>
                        </div>
                        <div class="post-content">${post.content}</div>
                    `;
                    postsContainer.appendChild(postDiv);
                });
            });
        }

        function updateUserDisplays(name) {
            const letter = name.charAt(0).toUpperCase();
            document.getElementById('navAvatar').innerText = letter;
            document.getElementById('creatorAvatar').innerText = letter;
            document.getElementById('profileAvatarLarge').innerText = letter;
            document.getElementById('profileNameDisplay').innerText = name;
        }

        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.showProfileView = () => document.getElementById('profile-view').style.display = 'block';
        window.showFeedView = () => document.getElementById('profile-view').style.display = 'none';
    </script>
</body>
</html>
