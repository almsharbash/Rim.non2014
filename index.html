<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - Kalimat</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #18132a;
            --input-bg: #221b3b;
            --primary: #8b5cf6;
            --text-color: #ffffff;
            --text-muted: #a0a0b8;
            --border-color: #2e264a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- إدارة الحساب والمفاتيح -->
    <div class="card">
        <div class="section-title">
            🔑 إدارة الحساب والمفاتيح
        </div>
        
        <div class="form-group">
            <label>المفتاح العام (Public Key - npub):</label>
            <input type="text" id="publicKeyInput" readonly placeholder="سيظهر المفتاح العام هنا...">
        </div>

        <div class="form-group">
            <label>المفتاح الخاص (Private Key - nsec):</label>
            <input type="text" id="privateKeyInput" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
        </div>

        <button type="button" class="btn-primary" id="btnGenerate">توليد حساب جديد ✨</button>
        <button type="button" class="btn-secondary" id="btnLogin">تسجيل الدخول بالمفتاح</button>
    </div>

    <!-- تعديل الملف الشخصي -->
    <div class="card">
        <div class="section-title">
            👤 تعديل الملف الشخصي
        </div>

        <div class="form-group">
            <label>اسم العرض:</label>
            <input type="text" id="displayNameInput" placeholder="أدخل اسم العرض">
        </div>

        <div class="form-group">
            <label>اسم المستخدم (Handle):</label>
            <input type="text" id="handleInput" placeholder="username">
        </div>

        <div class="form-group">
            <label>رابط الصورة الشخصية (Picture URL):</label>
            <input type="url" id="pictureUrlInput" placeholder="https://example.com/avatar.jpg">
        </div>

        <div class="form-group">
            <label>نبذة شخصية (Bio):</label>
            <textarea id="bioInput" rows="3" placeholder="اكتب نبذة عنك..."></textarea>
        </div>

        <button type="button" class="btn-primary" id="btnSave">حفظ التغيرات</button>
    </div>

</div>

<script type="module">
  import * as NostrTools from 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.0/+esm';

  const RELAYS = [
    'wss://relay.damus.io',
    'wss://nos.lol',
    'wss://relay.nostr.band'
  ];

  function hexToBytes(hex) {
    let bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  // جلب البيانات من شبكة Nostr
  async function fetchProfile(pubkeyHex) {
    try {
      const pool = new NostrTools.SimplePool();
      const event = await pool.get(RELAYS, {
        kinds: [0],
        authors: [pubkeyHex]
      });

      if (event && event.content) {
        const metadata = JSON.parse(event.content);
        document.getElementById('displayNameInput').value = metadata.display_name || metadata.name || '';
        document.getElementById('handleInput').value = metadata.username || metadata.name || '';
        document.getElementById('pictureUrlInput').value = metadata.picture || '';
        document.getElementById('bioInput').value = metadata.about || '';
      }
      pool.close(RELAYS);
    } catch (e) {
      console.warn('تعذر جلب البيانات:', e);
    }
  }

  // تسجيل الدخول الحقيقي
  async function performLogin(privInput) {
    let skBytes;

    if (privInput.startsWith('nsec1')) {
      const decoded = NostrTools.nip19.decode(privInput);
      if (decoded.type === 'nsec') {
        skBytes = decoded.data;
      }
    } else {
      skBytes = hexToBytes(privInput);
    }

    const pkHex = NostrTools.getPublicKey(skBytes);
    const npub = NostrTools.nip19.npubEncode(pkHex);
    const nsec = privInput.startsWith('nsec1') ? privInput : NostrTools.nip19.nsecEncode(skBytes);

    // حفظ البيانات في المتصفح
    localStorage.setItem('kalimat_nsec', nsec);
    localStorage.setItem('kalimat_npub', npub);
    localStorage.setItem('kalimat_pk_hex', pkHex);

    // تحديث الواجهة
    document.getElementById('publicKeyInput').value = npub;
    document.getElementById('privateKeyInput').value = nsec;

    // استرجاع البروفايل من السيرفرات
    await fetchProfile(pkHex);
  }

  // التوليد والتسجيل
  document.getElementById('btnGenerate').addEventListener('click', async () => {
    try {
      const skBytes = NostrTools.generateSecretKey();
      const nsec = NostrTools.nip19.nsecEncode(skBytes);
      await performLogin(nsec);
      alert('تم توليد حساب جديد وتسجيل الدخول بنجاح!');
    } catch (e) {
      alert('خطأ في التوليد: ' + e.message);
    }
  });

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const btn = document.getElementById('btnLogin');
    const input = document.getElementById('privateKeyInput').value.trim();

    if (!input) {
      alert('يرجى كتابة أو لصق المفتاح الخاص (nsec1...) أولاً');
      return;
    }

    try {
      btn.innerText = 'جاري التحقق والجلب...';
      btn.disabled = true;

      await performLogin(input);

      alert('تم تسجيل الدخول بنجاح!');
    } catch (e) {
      alert('المفتاح الخاص غير صحيح، يرجى التأكد منه.');
    } finally {
      btn.innerText = 'تسجيل الدخول بالمفتاح';
      btn.disabled = false;
    }
  });

  // استعادة الجلسة فور فتح الصفحة
  window.addEventListener('DOMContentLoaded', async () => {
    const saved = localStorage.getItem('kalimat_nsec');
    if (saved) {
      await performLogin(saved);
    }
  });
</script>

</body>
</html>
