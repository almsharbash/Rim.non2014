<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كلمات - Words</title>
    
    <style>
        :root {
            --bg-main: #0c1017;
            --bg-card: #151a26;
            --border-color: #1e2638;
            --btn-purple: #8b5cf6;
            --accent-blue: #0088ff;
            --text-main: #f3f4f6;
            --text-muted: #8e9bb0;
            --input-bg: #090c12;
            --green-success: #10b981;
            --heart-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-main);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر العلوي */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: rgba(21, 26, 38, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-title {
            font-weight: bold;
            font-size: 20px;
            color: var(--btn-purple);
            letter-spacing: 0.5px;
        }

        .btn-settings-icon {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* الشاشات */
        .page-screen {
            display: none;
            padding: 12px;
            padding-bottom: 80px;
            flex: 1;
        }

        .page-screen.active {
            display: block;
        }

        /* مساحة النشر المباشرة */
        .composer-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .composer-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .user-avatar-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--btn-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .composer-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 60px;
            padding-top: 6px;
        }

        /* معاينة الصورة المرفقة قبل النشر */
        .image-preview-box {
            display: none;
            position: relative;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .image-preview-box img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .remove-img-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 14px;
        }

        .composer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 8px;
        }

        .composer-tools {
            display: flex;
            gap: 16px;
            color: var(--btn-purple);
            font-size: 20px;
            align-items: center;
        }

        .composer-tools label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .btn-publish {
            background-color: var(--btn-purple);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-publish:active {
            transform: scale(0.96);
        }

        /* كروت المنشورات */
        .post-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-user-info {
            display: flex;
            flex-direction: column;
        }

        .post-user-name {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
        }

        .post-handle {
            font-size: 12px;
            color: var(--text-muted);
            direction: ltr;
            text-align: right;
        }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
            position: absolute;
            left: 14px;
            top: 14px;
        }

        .post-content {
            font-size: 14.5px;
            line-height: 1.5;
            color: #e5e7eb;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
            max-height: 300px;
            object-fit: cover;
        }

        /* أزرار التفاعل الرمزية الحديثة دون تداخل */
        .post-actions {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
            color: var(--text-muted);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .action-btn svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .action-btn.liked {
            color: var(--heart-red);
        }

        .action-btn.reposted {
            color: var(--green-success);
        }

        /* الإعدادات والبروفايل */
        .setting-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .setting-card-title {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-field {
            width: 100%;
            padding: 11px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--btn-purple);
        }

        .btn-primary {
            background-color: var(--btn-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--btn-purple);
            border: 1px solid var(--btn-purple);
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .btn-copy {
            background-color: #1a2333;
            color: #a5b4fc;
            border: 1px solid var(--border-color);
            padding: 0 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .status-badge {
            color: var(--green-success);
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        /* شريط التنقل السفلي */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background-color: rgba(21, 26, 38, 0.98);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 12px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--btn-purple);
            background-color: rgba(139, 92, 246, 0.1);
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- الهيدر العلوي -->
    <div class="app-header">
        <div class="app-title">كلمات</div>
        <button class="btn-settings-icon" onclick="switchPage('settings-screen')">⚙️ الإعدادات</button>
    </div>

    <!-- 1. شاشة النشر والمنشورات -->
    <div id="feed-screen" class="page-screen active">
        
        <!-- مساحة النشر المباشرة المفتوحة -->
        <div class="composer-card">
            <div class="composer-header">
                <div class="user-avatar-img" id="composer-avatar">M</div>
                <textarea id="composer-input" class="composer-textarea" placeholder="ماذا يدور في ذهنك؟"></textarea>
            </div>

            <!-- مربع معاينة الصورة في حال اختيارها -->
            <div id="image-preview-box" class="image-preview-box">
                <button class="remove-img-btn" onclick="removeAttachedImage()">✕</button>
                <img id="image-preview-img" src="" alt="المعاينة">
            </div>

            <div class="composer-actions">
                <div class="composer-tools">
                    <!-- رفع صورة مباشرة من الجهاز بدون prompt -->
                    <label title="إرفاق صورة">
                        🖼️
                        <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                    </label>
                    <span>🏷️</span>
                    <span>😊</span>
                </div>
                <button class="btn-publish" onclick="publishNewPost()">نشر</button>
            </div>
        </div>

        <!-- أحدث المنشورات الحية -->
        <div id="posts-container">

            <!-- منشور 1 -->
            <div class="post-card">
                <span class="post-time">الآن</span>
                <div class="post-header">
                    <div class="user-avatar-img" style="background:#8b5cf6;">A</div>
                    <div class="post-user-info">
                        <div class="post-user-name">@almsharbash</div>
                    </div>
                </div>
                <div class="post-content">أهلاً بكم في المنصة المحدثة بحلتها التفاعلية الحية! 🚀</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleComment(this)">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                        <span>0</span>
                    </button>
                    <button class="action-btn" onclick="toggleRepost(this)">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                        <span>0</span>
                    </button>
                    <button class="action-btn" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </button>
                </div>
            </div>

            <!-- منشور 2 -->
            <div class="post-card">
                <span class="post-time">منذ يومين</span>
                <div class="post-header">
                    <div class="user-avatar-img" style="background:#3b82f6;">Y</div>
                    <div class="post-user-info">
                        <div class="post-user-name">Yasser Al-Hussein</div>
                        <div class="post-handle">@yasser</div>
                    </div>
                </div>
                <div class="post-content">التصميم الجديد يعمل بمرونة وسرعة فائقة مع إمكانية التفاعل والمشاركة الفورية! 🚀</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleComment(this)">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                        <span>12</span>
                    </button>
                    <button class="action-btn" onclick="toggleRepost(this)">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                        <span>4</span>
                    </button>
                    <button class="action-btn" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>45</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 2. شاشة الإعدادات والبروفايل الحية -->
    <div id="settings-screen" class="page-screen">
        
        <!-- إدارة المفاتيح -->
        <div class="setting-card">
            <div class="setting-card-title">🔑 إدارة الحساب والمفاتيح</div>
            
            <label class="field-label">المفتاح العام (Public Key - npub):</label>
            <div class="input-group">
                <input type="text" id="display-npub" class="input-field" readonly placeholder="npub1...">
                <button class="btn-copy" onclick="copyText('display-npub')">نسخ</button>
            </div>

            <label class="field-label">المفتاح الخاص (Private Key - nsec):</label>
            <div class="input-group">
                <input type="text" id="setting-nsec" class="input-field" placeholder="nsec1...">
                <button class="btn-copy" onclick="copyText('setting-nsec')">نسخ</button>
            </div>

            <button class="btn-primary" onclick="generateKeys()">توليد حساب جديد ✨</button>
            <button class="btn-secondary" onclick="loginUser()">تسجيل الدخول بالمفتاح 🔑</button>
            <div id="login-status" class="status-badge">✓ تم تسجيل الدخول وجلسة التوقيع نشطة</div>
        </div>

        <!-- تعديل الملف الشخصي -->
        <div class="setting-card">
            <div class="setting-card-title">👤 تعديل الملف الشخصي</div>
            
            <label class="field-label">اسم العرض (Display Name):</label>
            <input type="text" id="edit-display-name" class="input-field" placeholder="مثال: ياسر">

            <label class="field-label">اسم المستخدم (Handle):</label>
            <input type="text" id="edit-handle" class="input-field" placeholder="مثال: yasser">

            <label class="field-label">رابط الصورة الشخصية (Avatar URL):</label>
            <input type="text" id="edit-avatar-url" class="input-field" placeholder="https://example.com/image.jpg">

            <button class="btn-primary" onclick="saveProfileData()">حفظ التغيرات وتطبيقها 💾</button>
        </div>
    </div>

    <!-- الشريط السفلي للتنقل -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('feed-screen')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button class="nav-item" onclick="switchPage('settings-screen')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
        <button class="nav-item" onclick="switchPage('feed-screen')">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </button>
        <button class="nav-item" onclick="switchPage('settings-screen')">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6 3.6z"/></svg>
        </button>
    </div>

</div>

<script>
let currentAttachedImageBase64 = "";

// التنقل بين الشاشات
function switchPage(pageId) {
    document.querySelectorAll('.page-screen').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');

    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    if(pageId === 'feed-screen') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
    } else {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
    }
}

// التعامل مع اختيار صورة من الجهاز بدون prompt
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentAttachedImageBase64 = e.target.result;
            document.getElementById('image-preview-img').src = currentAttachedImageBase64;
            document.getElementById('image-preview-box').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

// حذف الصورة المرفقة قبل النشر
function removeAttachedImage() {
    currentAttachedImageBase64 = "";
    document.getElementById('image-preview-box').style.display = 'none';
    document.getElementById('image-file-input').value = "";
}

// تفاعل الإعجاب الرياكتيف
function toggleLike(btn) {
    const span = btn.querySelector('span');
    let count = parseInt(span.innerText) || 0;
    if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        span.innerText = count - 1;
    } else {
        btn.classList.add('liked');
        span.innerText = count + 1;
    }
}

// تفاعل إعادة النشر
function toggleRepost(btn) {
    const span = btn.querySelector('span');
    let count = parseInt(span.innerText) || 0;
    if (btn.classList.contains('reposted')) {
        btn.classList.remove('reposted');
        span.innerText = count - 1;
    } else {
        btn.classList.add('reposted');
        span.innerText = count + 1;
    }
}

// تفاعل التعليق
function toggleComment(btn) {
    const span = btn.querySelector('span');
    let count = parseInt(span.innerText) || 0;
    span.innerText = count + 1;
}

// نشر منشور جديد من المساحة الواسعة
function publishNewPost() {
    const textInput = document.getElementById('composer-input');
    const text = textInput.value.trim();

    if(!text && !currentAttachedImageBase64) {
        return;
    }

    const profile = JSON.parse(localStorage.getItem('kalimat_profile')) || { name: 'أنا', handle: 'me' };
    const avatarChar = (profile.name || 'M').charAt(0).toUpperCase();
    const avatarContent = profile.avatar ? `<img src="${profile.avatar}" style="width:100%;height:100%;object-fit:cover;">` : avatarChar;

    const container = document.getElementById('posts-container');
    const imgHTML = currentAttachedImageBase64 ? `<img src="${currentAttachedImageBase64}" class="post-image">` : '';

    const postHTML = `
        <div class="post-card">
            <span class="post-time">الآن</span>
            <div class="post-header">
                <div class="user-avatar-img">${avatarContent}</div>
                <div class="post-user-info">
                    <div class="post-user-name">${profile.name}</div>
                    <div class="post-handle">@${profile.handle}</div>
                </div>
            </div>
            <div class="post-content">${text}</div>
            ${imgHTML}
            <div class="post-actions">
                <button class="action-btn" onclick="toggleComment(this)">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    <span>0</span>
                </button>
                <button class="action-btn" onclick="toggleRepost(this)">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    <span>0</span>
                </button>
                <button class="action-btn" onclick="toggleLike(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>0</span>
                </button>
            </div>
        </div>
    `;

    container.insertAdjacentHTML('afterbegin', postHTML);
    textInput.value = '';
    removeAttachedImage();
}

// حفظ البروفايل
function saveProfileData() {
    const name = document.getElementById('edit-display-name').value.trim();
    const handle = document.getElementById('edit-handle').value.trim();
    const avatar = document.getElementById('edit-avatar-url').value.trim();

    const profile = { 
        name: name || 'مستخدم', 
        handle: handle || 'user',
        avatar: avatar || ''
    };
    
    localStorage.setItem('kalimat_profile', JSON.stringify(profile));
    applyProfileToUI(profile);
    switchPage('feed-screen');
}

function applyProfileToUI(profile) {
    if(!profile) return;
    const char = (profile.name || profile.handle || 'M').charAt(0).toUpperCase();
    const composerAvatar = document.getElementById('composer-avatar');

    if(profile.avatar) {
        composerAvatar.innerHTML = `<img src="${profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    } else {
        composerAvatar.innerText = char;
    }
}

function copyText(id) {
    const el = document.getElementById(id);
    if(el && el.value) {
        navigator.clipboard.writeText(el.value);
    }
}

function generateKeys() {
    const rand = Math.random().toString(36).substring(2, 15);
    const nsec = "nsec1" + rand;
    const npub = "npub1" + rand;

    document.getElementById('setting-nsec').value = nsec;
    document.getElementById('display-npub').value = npub;
    
    localStorage.setItem('kalimat_nsec', nsec);
    localStorage.setItem('kalimat_npub', npub);
    
    document.getElementById('login-status').style.display = 'block';
}

function loginUser() {
    const nsec = document.getElementById('setting-nsec').value.trim();
    if(nsec) {
        const npub = "npub1" + nsec.substring(5);
        document.getElementById('display-npub').value = npub;
        localStorage.setItem('kalimat_nsec', nsec);
        localStorage.setItem('kalimat_npub', npub);
        document.getElementById('login-status').style.display = 'block';
    }
}

window.onload = function() {
    const nsec = localStorage.getItem('kalimat_nsec');
    const npub = localStorage.getItem('kalimat_npub');
    const profile = JSON.parse(localStorage.getItem('kalimat_profile'));

    if(nsec) document.getElementById('setting-nsec').value = nsec;
    if(npub) document.getElementById('display-npub').value = npub;

    if(profile) {
        document.getElementById('edit-display-name').value = profile.name || '';
        document.getElementById('edit-handle').value = profile.handle || '';
        document.getElementById('edit-avatar-url').value = profile.avatar || '';
        applyProfileToUI(profile);
    }
};
</script>
