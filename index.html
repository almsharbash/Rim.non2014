<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كلمات</title>
    
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #131722;
            --border-color: #1e2638;
            --btn-purple: #8b5cf6;
            --btn-purple-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #0d111a;
            --green-success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* إدارة عرض الشاشات */
        .screen-page {
            display: none;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 70px;
        }

        .screen-page.active {
            display: block;
        }

        /* الهيدر العلوي */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-title {
            font-weight: bold;
            font-size: 18px;
            color: var(--btn-purple);
        }

        /* البطاقات والحقول */
        .setting-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .setting-card-title {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            display: block;
            margin-bottom: 6px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--btn-purple);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 70px;
        }

        /* الأزرار */
        .btn-primary {
            background-color: var(--btn-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--btn-purple);
            border: 1px solid var(--btn-purple);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-copy {
            background-color: #1f293d;
            color: #c7d2fe;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .status-badge {
            color: var(--green-success);
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        /* المنشورات */
        .post-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        /* الشريط السفلي للتنقل */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 8px 16px;
        }

        .nav-item.active {
            color: var(--btn-purple);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="app-header">
        <div class="app-title">كلمات</div>
        <button class="btn-copy" onclick="switchPage('settings-screen')">⚙️ الإعدادات</button>
    </div>

    <!-- 1. شاشة المنصة والفييد الرئيسي -->
    <div id="feed-screen" class="screen-page active">
        
        <!-- صندوق إنشاء منشور جديد -->
        <div class="setting-card">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--btn-purple); display: flex; align-items: center; justify-content: center; font-weight: bold;" id="feed-avatar-char">
                    U
                </div>
                <div>
                    <strong id="feed-display-name" style="font-size: 14px; display: block;">اسم المستخدم</strong>
                    <span id="feed-handle" style="font-size: 11px; color: var(--text-muted);">@username</span>
                </div>
            </div>
            <textarea id="new-post-content" class="input-field" placeholder="ماذا يدور في ذهنك؟ اكتب منشورك بالتفصيل..."></textarea>
            <button class="btn-primary" onclick="publishPost()">نشر 🚀</button>
        </div>

        <!-- قائمة التغذية والمناشورات -->
        <div id="posts-container">
            <!-- سيتم إضافة المنشورات هنا تلقائياً -->
        </div>
    </div>

    <!-- 2. شاشة إدارة الحساب والإعدادات -->
    <div id="settings-screen" class="screen-page">
        <!-- إدارة الحساب والمفاتيح -->
        <div class="setting-card">
            <div class="setting-card-title">🔑 إدارة الحساب والمفاتيح</div>
            
            <label class="field-label">المفتاح العام (Public Key - npub):</label>
            <div class="input-group">
                <button class="btn-copy" onclick="copyToClipboard('display-npub')">نسخ</button>
                <input type="text" id="display-npub" class="input-field" readonly placeholder="سيظهر المفتاح العام هنا...">
            </div>

            <label class="field-label">المفتاح الخاص (Private Key - nsec):</label>
            <div class="input-group">
                <button class="btn-copy" onclick="copyToClipboard('setting-nsec')">نسخ</button>
                <input type="text" id="setting-nsec" class="input-field" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
            </div>

            <button class="btn-primary" onclick="generateNostrAccount()">توليد حساب جديد ✨</button>
            <button class="btn-secondary" onclick="loginAndGoToFeed()">تسجيل الدخول بالمفتاح 🔑</button>
            
            <div id="login-status" class="status-badge">✓ تم تسجيل الدخول وجلسة التوقيع نشطة</div>
        </div>

        <!-- تعديل الملف الشخصي -->
        <div class="setting-card">
            <div class="setting-card-title">👤 تعديل الملف الشخصي</div>
            
            <label class="field-label">اسم العرض:</label>
            <input type="text" id="edit-display-name" class="input-field" placeholder="أدخل اسم العرض">

            <label class="field-label">اسم المستخدم (Handle):</label>
            <input type="text" id="edit-handle" class="input-field" placeholder="username">

            <label class="field-label">رابط الصورة الشخصية (Picture URL):</label>
            <input type="text" id="edit-avatar" class="input-field" placeholder="https://example.com/avatar.jpg">

            <label class="field-label">نبذة شخصية (Bio):</label>
            <textarea id="edit-bio" class="input-field" placeholder="اكتب نبذة عنك..."></textarea>

            <button class="btn-primary" onclick="saveProfileAndGoToFeed()">حفظ التغيرات</button>
        </div>
    </div>

    <!-- الشريط السفلي للتنقل -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('feed-screen')">🏠</button>
        <button class="nav-item" onclick="switchPage('settings-screen')">👤</button>
    </div>

<script>
// التنقل بين الصفحات
function switchPage(pageId) {
    document.querySelectorAll('.screen-page').forEach(page => page.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');

    // تحديث الأزرار
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    if(pageId === 'feed-screen') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        updateFeedUI();
    } else {
        document.querySelectorAll('.nav-item')[1].classList.add('active');
    }
}

// دالة النسخ
function copyToClipboard(elementId) {
    const inputEl = document.getElementById(elementId);
    if (!inputEl || !inputEl.value) return;
    navigator.clipboard.writeText(inputEl.value).then(() => alert("تم النسخ!"));
}

// توليد مفاتيح والانتقال للمنصة
function generateNostrAccount() {
    const hexChars = '0123456789abcdef';
    let randomHex = '';
    for (let i = 0; i < 58; i++) {
        randomHex += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
    }

    const nsec = 'nsec1' + randomHex;
    const npub = 'npub1' + randomHex;

    document.getElementById('setting-nsec').value = nsec;
    document.getElementById('display-npub').value = npub;

    localStorage.setItem('kalimat_nsec', nsec);
    localStorage.setItem('kalimat_npub', npub);

    document.getElementById('login-status').style.display = 'block';
    
    // انتقال مباشر للمنصة بعد التوليد
    setTimeout(() => switchPage('feed-screen'), 500);
}

// تسجيل الدخول والانتقال للمنصة
function loginAndGoToFeed() {
    const nsecInput = document.getElementById('setting-nsec').value.trim();
    if (!nsecInput) {
        alert("يرجى إدخال أو توليد المفتاح الخاص أولاً.");
        return;
    }

    let npub = 'npub1' + (nsecInput.startsWith('nsec1') ? nsecInput.substring(5) : nsecInput);
    document.getElementById('display-npub').value = npub;

    localStorage.setItem('kalimat_nsec', nsecInput);
    localStorage.setItem('kalimat_npub', npub);

    document.getElementById('login-status').style.display = 'block';

    // الانتقال التلقائي الفوري إلى شاشة المنصة
    switchPage('feed-screen');
}

// حفظ الملف الشخصي والانتقال
function saveProfileAndGoToFeed() {
    const name = document.getElementById('edit-display-name').value.trim();
    const handle = document.getElementById('edit-handle').value.trim();
    const avatar = document.getElementById('edit-avatar').value.trim();
    const bio = document.getElementById('edit-bio').value.trim();

    const profile = { name, handle, avatar, bio };
    localStorage.setItem('kalimat_profile', JSON.stringify(profile));

    switchPage('feed-screen');
}

// تحديث بيانات المستخدم في واجهة المنصة
function updateFeedUI() {
    const savedProfile = JSON.parse(localStorage.getItem('kalimat_profile')) || {};
    const name = savedProfile.name || 'مستخدم جديد';
    
    document.getElementById('feed-display-name').innerText = name;
    document.getElementById('feed-handle').innerText = '@' + (savedProfile.handle || 'user');
    document.getElementById('feed-avatar-char').innerText = name.charAt(0).toUpperCase();
}

// إدارة المنشورات وقراءتها وإرسالها
function loadPosts() {
    const container = document.getElementById('posts-container');
    const posts = JSON.parse(localStorage.getItem('kalimat_posts')) || [
        {
            author: 'كلمات',
            handle: 'kalimat',
            content: '🎉 أهلاً بك في منصة كلمات! جرى تسجيل دخولك بنجاح والمنصة تعمل بشكل حي ومباشر الآن.',
            time: 'الآن'
        }
    ];

    container.innerHTML = '';
    posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--btn-purple); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    ${post.author.charAt(0).toUpperCase()}
                </div>
                <div>
                    <strong style="display: block; font-size: 13.5px;">${post.author}</strong>
                    <span style="font-size: 11px; color: var(--text-muted);">@${post.handle} • ${post.time}</span>
                </div>
            </div>
            <div style="background: var(--input-bg); padding: 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.5;">
                ${post.content}
            </div>
        `;
        container.appendChild(card);
    });
}

function publishPost() {
    const textarea = document.getElementById('new-post-content');
    const content = textarea.value.trim();

    if (!content) {
        alert("يرجى كتابة نص المنشور أولاً.");
        return;
    }

    const savedProfile = JSON.parse(localStorage.getItem('kalimat_profile')) || {};
    const newPost = {
        author: savedProfile.name || 'مستخدم',
        handle: savedProfile.handle || 'user',
        content: content,
        time: 'الآن'
    };

    const posts = JSON.parse(localStorage.getItem('kalimat_posts')) || [];
    posts.unshift(newPost);
    localStorage.setItem('kalimat_posts', JSON.stringify(posts));

    textarea.value = '';
    loadPosts();
}

// تحميل البيانات المحفوظة عند الفتح
function loadData() {
    const savedNsec = localStorage.getItem('kalimat_nsec');
    const savedNpub = localStorage.getItem('kalimat_npub');
    const savedProfile = JSON.parse(localStorage.getItem('kalimat_profile'));

    if (savedNsec) {
        document.getElementById('setting-nsec').value = savedNsec;
        document.getElementById('login-status').style.display = 'block';
    }
    if (savedNpub) document.getElementById('display-npub').value = savedNpub;

    if (savedProfile) {
        if (savedProfile.name) document.getElementById('edit-display-name').value = savedProfile.name;
        if (savedProfile.handle) document.getElementById('edit-handle').value = savedProfile.handle;
        if (savedProfile.avatar) document.getElementById('edit-avatar').value = savedProfile.avatar;
        if (savedProfile.bio) document.getElementById('edit-bio').value = savedProfile.bio;
    }

    updateFeedUI();
    loadPosts();
}

document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
