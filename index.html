<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلمات - إدارة الحساب</title>
  <style>
    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1a1d2d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a5b5;
      margin-bottom: 6px;
    }
    .input-wrapper {
      display: flex;
      gap: 8px;
    }
    input {
      width: 100%;
      background-color: #0d0f17;
      border: 1px solid #2e344d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus {
      border-color: #7c5dfa;
    }
    .btn-copy {
      background-color: #252a3e;
      color: #8b92b0;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-primary {
      width: 100%;
      background-color: #7c5dfa;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-size: 0.95rem;
    }
    .btn-secondary {
      width: 100%;
      background-color: transparent;
      border: 1px solid #3d4468;
      color: #b0b7d0;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 420px;">
    
    <!-- قسم إدارة المفاتيح -->
    <div class="card">
      <h2>🔑 إدارة الحساب والمفاتيح</h2>
      
      <div class="field-group">
        <label>المفتاح العام (Public Key - npub):</label>
        <div class="input-wrapper">
          <input type="text" id="publicKey" placeholder="أدخل أو يلصق المفتاح العام هنا..." />
          <button class="btn-copy" onclick="copyToClipboard('publicKey')">نسخ</button>
        </div>
      </div>

      <div class="field-group">
        <label>المفتاح الخاص (Private Key - nsec):</label>
        <div class="input-wrapper">
          <input type="password" id="privateKey" placeholder="أدخل المفتاح الخاص للتسجيل..." />
          <button class="btn-copy" onclick="copyToClipboard('privateKey')">نسخ</button>
        </div>
      </div>

      <button class="btn-primary" onclick="generateNewAccount()">✨ توليد حساب جديد</button>
      <button class="btn-secondary" onclick="login()">تسجيل الدخول والدخول للمنصة</button>
    </div>

    <!-- قسم الملف الشخصي والصورة -->
    <div class="card">
      <h2>👤 تعديل الملف الشخصي</h2>
      
      <div class="field-group">
        <label>اسم العرض:</label>
        <input type="text" id="displayName" placeholder="مثال: أحمد" />
      </div>

      <div class="field-group">
        <label>اسم المستخدم (Handle):</label>
        <input type="text" id="handle" placeholder="مثال: ahmed_12" />
      </div>

      <div class="field-group">
        <label>رابط الصورة الشخصية (Avatar URL):</label>
        <input type="url" id="avatarUrl" placeholder="https://example.com/my-photo.jpg" />
      </div>
    </div>

  </div>

  <script>
    // دالة إنشاء مفاتيح سداسية عشرية (Hex) عشوائية بسيطة للاختبار
    function generateHexKey(length = 64) {
      const chars = '0123456789abcdef';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // توليد حساب جديد بمفتاحين مختلفين تماماً
    function generateNewAccount() {
      const privateKey = 'nsec1' + generateHexKey(58);
      const publicKey = 'npub1' + generateHexKey(58);

      document.getElementById('privateKey').value = privateKey;
      document.getElementById('publicKey').value = publicKey;
      
      alert('تم توليد مفاتيح الحساب بنجاح!');
    }

    // دالة نسخ النصوص للذاكرة
    function copyToClipboard(elementId) {
      const input = document.getElementById(elementId);
      if (!input.value) {
        alert('لا يوجد نص لنسخه');
        return;
      }
      navigator.clipboard.writeText(input.value);
      alert('تم النسخ بنجاح!');
    }

    // تسجيل الدخول وحفظ البيانات
    function login() {
      const pubKey = document.getElementById('publicKey').value;
      const privKey = document.getElementById('privateKey').value;
      const name = document.getElementById('displayName').value;
      const handle = document.getElementById('handle').value;
      const avatar = document.getElementById('avatarUrl').value;

      if (!pubKey && !privKey) {
        alert('يرجى أدخال المفتاح الخاص أو العام للتسجيل');
        return;
      }

      // حفظ بيانات المستخدم في localStorage لتجهيز الحساب
      const userData = {
        publicKey: pubKey,
        privateKey: privKey,
        displayName: name,
        handle: handle,
        avatar: avatar
      };

      localStorage.setItem('user_session', JSON.stringify(userData));
      alert('تم تسجيل الدخول وإعداد الحساب بنجاح!');
    }
  </script>
</body>
</html>
