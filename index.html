<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلمات - إدارة الحساب</title>
  <!-- تضمين مكتبة nostr-tools الرسمية -->
  <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
  <style>
    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1a1d2d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a5b5;
      margin-bottom: 6px;
    }
    .input-wrapper {
      display: flex;
      gap: 8px;
    }
    input {
      width: 100%;
      background-color: #0d0f17;
      border: 1px solid #2e344d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus {
      border-color: #7c5dfa;
    }
    .btn-copy {
      background-color: #252a3e;
      color: #8b92b0;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-primary {
      width: 100%;
      background-color: #7c5dfa;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-size: 0.95rem;
    }
    .btn-secondary {
      width: 100%;
      background-color: transparent;
      border: 1px solid #3d4468;
      color: #b0b7d0;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #4cd964;
      text-align: center;
    }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 420px;">
    
    <div class="card">
      <h2>🔑 إدارة الحساب والمفاتيح</h2>
      
      <div class="field-group">
        <label>المفتاح العام (Public Key - npub):</label>
        <div class="input-wrapper">
          <input type="text" id="publicKey" placeholder="npub1..." />
          <button class="btn-copy" onclick="copyToClipboard('publicKey')">نسخ</button>
        </div>
      </div>

      <div class="field-group">
        <label>المفتاح الخاص (Private Key - nsec):</label>
        <div class="input-wrapper">
          <input type="password" id="privateKey" placeholder="nsec1... أو Hex" />
          <button class="btn-copy" onclick="copyToClipboard('privateKey')">نسخ</button>
        </div>
      </div>

      <button class="btn-primary" onclick="generateNewAccount()">✨ توليد حساب جديد</button>
      <button class="btn-secondary" onclick="loginAndPublish()">تسجيل الدخول والدخول للمنصة</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card">
      <h2>👤 تعديل الملف الشخصي</h2>
      
      <div class="field-group">
        <label>اسم العرض:</label>
        <input type="text" id="displayName" placeholder="مثال: أحمد" />
      </div>

      <div class="field-group">
        <label>اسم المستخدم (Handle):</label>
        <input type="text" id="handle" placeholder="مثال: ahmed_12" />
      </div>

      <div class="field-group">
        <label>رابط الصورة الشخصية (Avatar URL):</label>
        <input type="url" id="avatarUrl" placeholder="https://..." />
      </div>
    </div>

  </div>

  <script>
    // توليد مفاتيح Nostr حقيقية وتنسيقها بصيغة npub/nsec
    function generateNewAccount() {
      try {
        const sk = NostrTools.generatePrivateKey();
        const pk = NostrTools.getPublicKey(sk);

        const nsec = NostrTools.nip19.nsecEncode(sk);
        const npub = NostrTools.nip19.npubEncode(pk);

        document.getElementById('privateKey').value = nsec;
        document.getElementById('publicKey').value = npub;
        
        showMessage('تم توليد مفاتيح Nostr بنجاح!');
      } catch (err) {
        alert('خطأ في توليد المفاتيح: ' + err.message);
      }
    }

    // دالة نسخ النصوص
    function copyToClipboard(elementId) {
      const input = document.getElementById(elementId);
      if (!input.value) return alert('لا يوجد نص لنسخه');
      navigator.clipboard.writeText(input.value);
      showMessage('تم النسخ بنجاح!');
    }

    // تسجيل الدخول وإرسال حدث الملف الشخصي (Metadata Event - Kind 0)
    async function loginAndPublish() {
      const privInput = document.getElementById('privateKey').value.trim();
      const pubInput = document.getElementById('publicKey').value.trim();
      
      if (!privInput && !pubInput) {
        alert('يرجى أدخال المفتاح الخاص أو العام للتسجيل');
        return;
      }

      let skHex = '';
      let pkHex = '';

      try {
        // تحويل المفتاح الخاص إذا كان ممرراً بصيغة nsec
        if (privInput.startsWith('nsec1')) {
          const decoded = NostrTools.nip19.decode(privInput);
          skHex = decoded.data;
          pkHex = NostrTools.getPublicKey(skHex);
        } else if (privInput.length === 64) {
          skHex = privInput;
          pkHex = NostrTools.getPublicKey(skHex);
        } else if (pubInput.startsWith('npub1')) {
          const decoded = NostrTools.nip19.decode(pubInput);
          pkHex = decoded.data;
        } else if (pubInput.length === 64) {
          pkHex = pubInput;
        }

        // تحديث الحقول بالصيغ المنسقة
        if (pkHex) {
          document.getElementById('publicKey').value = NostrTools.nip19.npubEncode(pkHex);
        }

        const name = document.getElementById('displayName').value;
        const handle = document.getElementById('handle').value;
        const avatar = document.getElementById('avatarUrl').value;

        // إعداد كائن الملف الشخصي
        const profileContent = {
          name: name,
          username: handle,
          picture: avatar
        };

        // حفظ بيانات الجلسة في المتصفح
        localStorage.setItem('nostr_user', JSON.stringify({
          pubkey: pkHex,
          privkey: skHex,
          profile: profileContent
        }));

        showMessage('تم تسجيل الدخول بنجاح! جاري التوجيه...');
        
        // التوجيه إلى الصفحة الرئيسية/المنصة بعد ثانية واحدة
        setTimeout(() => {
          window.location.href = '/'; 
        }, 1000);

      } catch (err) {
        alert('خطأ في التحقق من المفاتيح: ' + err.message);
      }
    }

    function showMessage(msg) {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.innerText = msg;
      setTimeout(() => { statusDiv.innerText = ''; }, 3000);
    }
  </script>
</body>
</html>
