<!-- قسم إدارة الحساب والمفاتيح -->
<div class="setting-card">
    <div class="setting-card-title">🔑 إدارة الحساب والمفاتيح</div>
    
    <!-- المفتاح العام -->
    <label style="font-size:12px; color:var(--text-muted); margin-top:8px; display:block;">المفتاح العام (Public Key - npub):</label>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
        <input type="text" id="display-npub" class="input-field" readonly placeholder="سيظهر المفتاح العام هنا...">
        <button class="btn-secondary" style="width: auto; margin:0; padding: 0 12px;" onclick="copyToClipboard('display-npub')">نسخ</button>
    </div>

    <!-- المفتاح الخاص (نص واضح وليس كلمة سر لتسهيل النسخ والقراءة) -->
    <label style="font-size:12px; color:var(--text-muted); margin-top:12px; display:block;">المفتاح الخاص (Private Key - nsec):</label>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
        <input type="text" id="setting-nsec" class="input-field" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
        <button class="btn-secondary" style="width: auto; margin:0; padding: 0 12px;" onclick="copyToClipboard('setting-nsec')">نسخ</button>
    </div>

    <!-- أزرار التوليد والدخول -->
    <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn-primary" onclick="generateNostrAccount()">توليد حساب جديد ✨</button>
        <button class="btn-secondary" onclick="loginWithNsec()">تسجيل الدخول بالمفتاح 🔑</button>
    </div>
</div>

<!-- قسم تعديل الملف الشخصي -->
<div class="setting-card" style="margin-top: 16px;">
    <div class="setting-card-title">👤 تعديل الملف الشخصي</div>
    
    <label style="font-size:12px; color:var(--text-muted);">اسم العرض:</label>
    <input type="text" id="edit-display-name" class="input-field" placeholder="أدخل اسم العرض">

    <label style="font-size:12px; color:var(--text-muted); margin-top:10px; display:block;">اسم المستخدم (Handle):</label>
    <input type="text" id="edit-handle" class="input-field" placeholder="username">

    <button class="btn-primary" style="margin-top:14px;" onclick="saveProfileData()">حفظ التغيرات</button>
</div>

<!-- سكريبت إدارة الحساب والنسخ -->
<script>
// دالة نسخ النصوص للذاكرة
function copyToClipboard(elementId) {
    const inputEl = document.getElementById(elementId);
    if (!inputEl || !inputEl.value) {
        alert("لا يوجد نص لنسخه!");
        return;
    }
    navigator.clipboard.writeText(inputEl.value).then(() => {
        alert("تم نسخ الرمز بنجاح إلى الحافظة! 📋");
    }).catch(() => {
        // طريقة بديلة للهواتف التي لا تدعم الحافظة الحديثة
        inputEl.select();
        document.execCommand('copy');
        alert("تم نسخ الرمز بنجاح! 📋");
    });
}

// دالة توليد مفاتيح Nostr عشوائية واضحة وقابلة للنسخ
function generateNostrAccount() {
    const hexChars = '0123456789abcdef';
    let randomHex = '';
    for (let i = 0; i < 58; i++) {
        randomHex += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
    }

    const nsec = 'nsec1' + randomHex;
    const npub = 'npub1' + randomHex;

    document.getElementById('setting-nsec').value = nsec;
    document.getElementById('display-npub').value = npub;

    // حفظ في الذاكرة المحلية
    localStorage.setItem('kalimat_nsec', nsec);
    localStorage.setItem('kalimat_npub', npub);

    alert("تم توليد الحساب والمفاتيح بنجاح! يمكنك الآن نسخ مفتاحك الخاص للحفاظ عليه.");
}

// دالة تسجيل الدخول بمفتاح nsec مدخل
function loginWithNsec() {
    const nsecInput = document.getElementById('setting-nsec').value.trim();
    if (!nsecInput) {
        alert("يرجى كتابة أو لصق المفتاح الخاص (nsec) أولاً.");
        return;
    }

    // إنشاء مفتاح عام بناءً على المدخلات
    let npub = 'npub1' + (nsecInput.startsWith('nsec1') ? nsecInput.substring(5) : nsecInput);
    
    document.getElementById('display-npub').value = npub;

    localStorage.setItem('kalimat_nsec', nsecInput);
    localStorage.setItem('kalimat_npub', npub);

    alert("تم تسجيل الدخول بنجاح بالمفتاح المدخل!");
}

// دالة حفظ بيانات الملف الشخصي
function saveProfileData() {
    const name = document.getElementById('edit-display-name').value.trim();
    const handle = document.getElementById('edit-handle').value.trim();

    if (!name || !handle) {
        alert("يرجى ملء اسم العرض واسم المستخدم.");
        return;
    }

    const profile = { name, handle };
    localStorage.setItem('kalimat_profile', JSON.stringify(profile));

    alert("تم حفظ بيانات الملف الشخصي بنجاح!");
}

// استرجاع البيانات المجهزة عند استدعاء الصفحة
function loadAccountData() {
    const savedNsec = localStorage.getItem('kalimat_nsec');
    const savedNpub = localStorage.getItem('kalimat_npub');
    const savedProfile = JSON.parse(localStorage.getItem('kalimat_profile'));

    if (savedNsec) document.getElementById('setting-nsec').value = savedNsec;
    if (savedNpub) document.getElementById('display-npub').value = savedNpub;

    if (savedProfile) {
        if (savedProfile.name) document.getElementById('edit-display-name').value = savedProfile.name;
        if (savedProfile.handle) document.getElementById('edit-handle').value = savedProfile.handle;
    }
}

// تشغيل جلب البيانات عند التحميل
document.addEventListener('DOMContentLoaded', loadAccountData);
</script>
