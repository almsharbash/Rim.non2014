<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات | Kalimat</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Tajawal', sans-serif;
            color: #1c1e21;
        }

        /* --- صفحة تسجيل الدخول --- */
        #login-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-container { text-align: center; margin-bottom: 20px; }
        .logo-img {
            width: 110px;
            height: auto;
            display: block;
            margin: 0 auto 5px auto;
            filter: drop-shadow(0px 6px 10px rgba(13, 71, 161, 0.15));
            mix-blend-mode: multiply;
        }
        .app-title {
            color: #0b4395;
            font-family: 'Aref Ruqaa', serif;
            font-size: 48px;
            font-weight: 700;
        }
        .app-desc { color: #555; font-size: 15px; max-width: 320px; }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .form-group { margin-bottom: 15px; }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        .forgot-pass { display: block; text-align: center; margin: 15px 0; color: #1a73e8; text-decoration: none; font-size: 14px; }
        .divider { height: 1px; background-color: #e0e0e0; margin: 20px 0; }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- نافذة إنشاء حساب جديد (Modal) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 20px 25px;
            position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .modal-title { font-size: 22px; font-weight: bold; color: #1c1e21; }
        .close-btn { background: none; border: none; font-size: 24px; color: #888; cursor: pointer; }
        .row-inputs { display: flex; gap: 10px; }

        /* --- واجهة المنشورات الرئيسية --- */
        #main-feed {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .top-navbar {
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .nav-logo { font-family: 'Aref Ruqaa', serif; font-size: 26px; color: #0b4395; text-decoration: none; }
        .search-box {
            background: #f0f2f5;
            border-radius: 20px;
            padding: 8px 16px;
            border: none;
            outline: none;
            width: 60%;
            font-family: 'Tajawal', sans-serif;
        }
        .post-creator {
            background: #ffffff;
            margin: 15px 10px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .creator-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #0b4395; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .creator-input {
            width: 100%;
            border: none;
            background: #f0f2f5;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }
        .creator-actions { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .action-btn { background: none; border: none; color: #555; font-size: 14px; cursor: pointer; font-family: 'Tajawal', sans-serif; }
        .post-card {
            background: #ffffff;
            margin: 15px 10px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            padding: 15px;
        }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-author { font-weight: bold; font-size: 15px; }
        .post-time { font-size: 12px; color: #777; }
        .post-content { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
        .post-footer { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .interaction-btn { background: none; border: none; color: #65676b; font-weight: 500; cursor: pointer; font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body>

    <!-- 1. صفحة التسجيل والدخول -->
    <div id="login-page">
        <div class="header-container">
            <img src="https://i.ibb.co/99VxKqb7/1789866824772.png" alt="كلمات" class="logo-img">
            <h1 class="app-title">كلمات</h1>
            <p class="app-desc">تواصل مع الأصدقاء والعالم من حولك عبر المنصة في مكان واحد.</p>
        </div>

        <div class="card">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="text" class="input-field" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                </div>
                <div class="form-group">
                    <input type="password" class="input-field" placeholder="كلمة السر" required>
                </div>
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
            </form>
            <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>
            <div class="divider"></div>
            <button class="btn-secondary" onclick="openRegisterModal()">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- 2. نافذة منبثقة لإنشاء حساب جديد -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">إنشاء حساب جديد</span>
                <button class="close-btn" onclick="closeRegisterModal()">&times;</button>
            </div>
            <form onsubmit="handleRegisterSubmit(event)">
                <div class="form-group row-inputs">
                    <input type="text" class="input-field" placeholder="الاسم الأول" required>
                    <input type="text" class="input-field" placeholder="اسم العائلة" required>
                </div>
                <div class="form-group">
                    <input type="email" class="input-field" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                </div>
                <div class="form-group">
                    <input type="password" class="input-field" placeholder="كلمة السر الجديدة" required>
                </div>
                <button type="submit" class="btn-secondary" style="margin-top: 10px;">تسجيل الحساب</button>
            </form>
        </div>
    </div>

    <!-- 3. واجهة المنشورات (Main Feed) -->
    <div id="main-feed">
        <nav class="top-navbar">
            <a href="#" class="nav-logo">كلمات</a>
            <input type="text" class="search-box" placeholder="بحث في كلمات...">
            <div class="user-avatar">ك</div>
        </nav>

        <div class="post-creator">
            <div class="creator-top">
                <div class="user-avatar">ك</div>
                <input type="text" id="postInput" class="creator-input" placeholder="بم تفكر يا صديقي؟">
            </div>
            <div class="creator-actions">
                <button class="action-btn" onclick="addPost()">📷 صورة/فيديو</button>
                <button class="action-btn" onclick="addPost()">😊 شعار/نشاط</button>
                <button class="action-btn" onclick="addPost()" style="color:#1a73e8; font-weight:bold;">نشر</button>
            </div>
        </div>

        <div id="postsContainer">
            <div class="post-card">
                <div class="post-header">
                    <div class="user-avatar">م</div>
                    <div>
                        <div class="post-author">محمد أحمد</div>
                        <div class="post-time">منذ 15 دقيقة</div>
                    </div>
                </div>
                <div class="post-content">
                    مرحباً بكم في منصة "كلمات"! هذه البداية الأولى للهيكل العظمي للمنصة، سنقوم بربطها قريباً بالسحابة وقاعدة البيانات.
                </div>
                <div class="post-footer">
                    <button class="interaction-btn">👍 أعجبني</button>
                    <button class="interaction-btn">💬 تعليق</button>
                    <button class="interaction-btn">↪️ مشاركة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // فتح وإغلاق نافذة التسجيل
        function openRegisterModal() {
            document.getElementById('registerModal').style.display = 'flex';
        }
        function closeRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
        }

        // معالجة تسجيل حساب جديد
        function handleRegisterSubmit(e) {
            e.preventDefault();
            alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
            closeRegisterModal();
        }

        // الدخول لواجهة المنشورات
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-feed').style.display = 'block';
        }

        // إضافة منشور جديد محلياً
        function addPost() {
            const input = document.getElementById('postInput');
            if (!input.value.trim()) return;

            const postsContainer = document.getElementById('postsContainer');
            const newPost = document.createElement('div');
            newPost.className = 'post-card';
            newPost.innerHTML = `
                <div class="post-header">
                    <div class="user-avatar">ك</div>
                    <div>
                        <div class="post-author">أنت</div>
                        <div class="post-time">الآن</div>
                    </div>
                </div>
                <div class="post-content">${input.value}</div>
                <div class="post-footer">
                    <button class="interaction-btn">👍 أعجبني</button>
                    <button class="interaction-btn">💬 تعليق</button>
                    <button class="interaction-btn">↪️ مشاركة</button>
                </div>
            `;
            postsContainer.prepend(newPost);
            input.value = '';
        }
    </script>
</body>
</html>
