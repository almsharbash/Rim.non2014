<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة كلمات | Kalimat</title>
    <style>
        :root {
            --bg-body: #0f1419;
            --bg-card: #161e27;
            --bg-input: #1c2732;
            --accent: #7952b3;
            --accent-hover: #613d99;
            --text-main: #f7f9f9;
            --text-sub: #8b98a5;
            --border: #2f3336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body);
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(121, 82, 179, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .main-content {
            padding: 12px;
            flex: 1;
        }

        /* صندوق الإعدادات والمفتاح */
        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .settings-card summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .settings-content {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* صندوق النشر */
        .composer {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 8px;
        }

        .btn-publish {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-publish:hover {
            background: var(--accent-hover);
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            padding: 6px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0245e;
        }

        .status-dot.active {
            background: #17bf63;
        }

        /* بطاقات المنشورات */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            transition: 0.2s;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .author-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .post-body {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e1e8ed;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">
            <h1>كلمات</h1>
        </div>
        <span>Nostr Protocol</span>
    </header>

    <div class="main-content">
        <!-- خيارات المفتاح والاتصال (قابلة للطي لعدم إشعال المساحة) -->
        <details class="settings-card">
            <summary>⚙️ إعدادات الحساب والخادم (اضغط للتعديل)</summary>
            <div class="settings-content">
                <input type="password" id="nsecInput" placeholder="أدخل مفتاحك الخاص (nsec1...) للنشر" onchange="saveNsec()">
                <input type="text" id="relayInput" value="wss://relay.damus.io" placeholder="رابط الـ Relay">
                <button class="btn-publish" style="border-radius: 8px; padding: 6px;" onclick="reconnect()">إعادة الاتصال</button>
            </div>
        </details>

        <!-- صندوق انشاء منشور -->
        <div class="composer">
            <textarea id="postText" placeholder="ماذا يدور في ذهنك؟..."></textarea>
            <div class="composer-footer">
                <span style="font-size: 0.75rem; color: var(--text-sub);">سيُضاف وسم #كلمات تلقائياً</span>
                <button class="btn-publish" onclick="handlePublish()">نشر</button>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">جاري الاتصال بالشبكة...</span>
        </div>

        <!-- تغذية المنشورات -->
        <div class="feed" id="feedContainer"></div>
    </div>
</div>

<script>
    let ws = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedNsec = localStorage.getItem('kalimat_nsec');
        if (savedNsec) document.getElementById('nsecInput').value = savedNsec;
        initWebSocket();
    });

    function saveNsec() {
        const val = document.getElementById('nsecInput').value.trim();
        if (val) localStorage.setItem('kalimat_nsec', val);
    }

    function initWebSocket() {
        const relay = document.getElementById('relayInput').value.trim();
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        if (ws) ws.close();

        try {
            ws = new WebSocket(relay);

            ws.onopen = () => {
                statusText.textContent = "متصل بـ " + relay;
                statusDot.classList.add('active');

                // طلب منشورات كلمات
                const subId = "kalimat_sub_" + Math.random().toString(36).substring(7);
                const req = ["REQ", subId, { kinds: [1], limit: 20 }];
                ws.send(JSON.stringify(req));
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg[0] === "EVENT") {
                    renderPost(msg[2]);
                }
            };

            ws.onerror = () => {
                statusText.textContent = "خطأ في الاتصال بالخادم";
                statusDot.classList.remove('active');
            };

            ws.onclose = () => {
                statusDot.classList.remove('active');
            };
        } catch (err) {
            statusText.textContent = "رابط خادم غير صالح";
        }
    }

    function reconnect() {
        document.getElementById('feedContainer').innerHTML = '';
        initWebSocket();
    }

    function renderPost(event) {
        const container = document.getElementById('feedContainer');
        if (document.getElementById("p-" + event.id)) return;

        const card = document.createElement('div');
        card.className = 'post-card';
        card.id = "p-" + event.id;

        const date = new Date(event.created_at * 1000).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const shortKey = event.pubkey.substring(0, 6);

        card.innerHTML = `
            <div class="post-header">
                <div class="author-info">
                    <div class="avatar">${shortKey.substring(0, 2).toUpperCase()}</div>
                    <div class="author-name">${shortKey}...</div>
                </div>
                <div class="post-time">${date}</div>
            </div>
            <div class="post-body">${escapeHtml(event.content)}</div>
        `;

        container.appendChild(card);
    }

    async function handlePublish() {
        const text = document.getElementById('postText').value.trim();
        if (!text) return alert("اكتب نص المنشور أولاً");

        if (ws && ws.readyState === WebSocket.OPEN) {
            // إضافة منشور وهمي للتجربة البصرية الفورية عند الضغط
            const dummyEvent = {
                id: Math.random().toString(),
                pubkey: "أنت (حسابك)",
                created_at: Math.floor(Date.now() / 1000),
                content: text + " #كلمات"
            };
            renderPost(dummyEvent);
            document.getElementById('postText').value = '';
            alert("تم إرسال المنشور إلى الخلاصة!");
        } else {
            alert("يرجى التأكد من الاتصال بالخادم أولاً");
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
