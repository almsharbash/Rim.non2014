<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - Kalimat</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #18132a;
            --input-bg: #221b3b;
            --primary: #8b5cf6;
            --text-color: #ffffff;
            --text-muted: #a0a0b8;
            --border-color: #2e264a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .status {
            font-size: 0.85rem;
            color: #10b981;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- إدارة الحساب والمفاتيح -->
    <div class="card">
        <div class="section-title">🔑 إدارة الحساب والمفاتيح</div>
        
        <div class="form-group">
            <label>المفتاح العام (Public Key - npub):</label>
            <input type="text" id="publicKeyInput" readonly placeholder="سيظهر المفتاح العام هنا...">
        </div>

        <div class="form-group">
            <label>المفتاح الخاص (Private Key - nsec):</label>
            <input type="text" id="privateKeyInput" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
        </div>

        <button type="button" class="btn-primary" id="btnGenerate">توليد حساب جديد ✨</button>
        <button type="button" class="btn-secondary" id="btnLogin">تسجيل الدخول بالمفتاح</button>
        <div class="status" id="loginStatus"></div>
    </div>

    <!-- تعديل الملف الشخصي -->
    <div class="card">
        <div class="section-title">👤 تعديل الملف الشخصي</div>

        <div class="form-group">
            <label>اسم العرض:</label>
            <input type="text" id="displayNameInput" placeholder="أدخل اسم العرض">
        </div>

        <div class="form-group">
            <label>اسم المستخدم (Handle):</label>
            <input type="text" id="handleInput" placeholder="username">
        </div>

        <div class="form-group">
            <label>رابط الصورة الشخصية (Picture URL):</label>
            <input type="url" id="pictureUrlInput" placeholder="https://example.com/avatar.jpg">
        </div>

        <div class="form-group">
            <label>نبذة شخصية (Bio):</label>
            <textarea id="bioInput" rows="3" placeholder="اكتب نبذة عنك..."></textarea>
        </div>

        <button type="button" class="btn-primary" id="btnSave">حفظ ونشر التغيرات على الشبكة 🚀</button>
    </div>

</div>

<script type="module">
  import * as NostrTools from 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.0/+esm';

  // سيرفرات Nostr النشطة
  const RELAYS = [
    'wss://relay.damus.io',
    'wss://nos.lol',
    'wss://relay.nostr.band'
  ];

  let currentSecretKeyBytes = null;

  function hexToBytes(hex) {
    let bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  // 1. تسجيل الدخول واسترجاع بيانات البروفايل الفعلية
  async function performLogin(nsecOrHex) {
    let skBytes;

    if (nsecOrHex.startsWith('nsec1')) {
      const decoded = NostrTools.nip19.decode(nsecOrHex);
      if (decoded.type === 'nsec') {
        skBytes = decoded.data;
      }
    } else {
      skBytes = hexToBytes(nsecOrHex);
    }

    currentSecretKeyBytes = skBytes;
    const pkHex = NostrTools.getPublicKey(skBytes);
    const npub = NostrTools.nip19.npubEncode(pkHex);
    const nsec = NostrTools.nip19.nsecEncode(skBytes);

    localStorage.setItem('kalimat_nsec', nsec);

    document.getElementById('publicKeyInput').value = npub;
    document.getElementById('privateKeyInput').value = nsec;
    document.getElementById('loginStatus').innerText = 'تم تسجيل الدخول وجلسة التوقيع نشطة ✓';

    // جلب البيانات المسجلة على Nostr
    const pool = new NostrTools.SimplePool();
    try {
      const event = await pool.get(RELAYS, { kinds: [0], authors: [pkHex] });
      if (event && event.content) {
        const meta = JSON.parse(event.content);
        document.getElementById('displayNameInput').value = meta.display_name || meta.name || '';
        document.getElementById('handleInput').value = meta.username || meta.name || '';
        document.getElementById('pictureUrlInput').value = meta.picture || '';
        document.getElementById('bioInput').value = meta.about || '';
      }
    } catch (e) {
      console.log('لم يتم العثور على بروفايل سابق');
    } finally {
      pool.close(RELAYS);
    }
  }

  // 2. زر توليد حساب
  document.getElementById('btnGenerate').addEventListener('click', async () => {
    const skBytes = NostrTools.generateSecretKey();
    const nsec = NostrTools.nip19.nsecEncode(skBytes);
    await performLogin(nsec);
    alert('تم توليد مفاتيح جديدة بنجاح!');
  });

  // 3. زر تسجيل الدخول
  document.getElementById('btnLogin').addEventListener('click', async () => {
    const input = document.getElementById('privateKeyInput').value.trim();
    if (!input) {
      alert('يرجى أدخل المفتاح الخاص nsec1...');
      return;
    }
    try {
      await performLogin(input);
      alert('تم تسجيل الدخول بنجاح!');
    } catch (e) {
      alert('المفتاح الخاص غير صحيح');
    }
  });

  // 4. حفظ ونشر التغييرات (توقيع الحدث الفعلي ونشره)
  document.getElementById('btnSave').addEventListener('click', async () => {
    if (!currentSecretKeyBytes) {
      alert('يرجى تسجيل الدخول أو توليد حساب أولاً لتتمكن من التوقيع والنشر!');
      return;
    }

    const btn = document.getElementById('btnSave');
    btn.innerText = 'جاري التوقيع والنشر على الشبكة...';
    btn.disabled = true;

    try {
      const profileData = {
        name: document.getElementById('handleInput').value,
        display_name: document.getElementById('displayNameInput').value,
        picture: document.getElementById('pictureUrlInput').value,
        about: document.getElementById('bioInput').value
      };

      // إنشاء وتوقيع حدث Nostr من النوع Kind 0
      const eventTemplate = {
        kind: 0,
        created_at: Math.floor(Date.now() / 1000),
        tags: [],
        content: JSON.stringify(profileData)
      };

      const signedEvent = NostrTools.finalizeEvent(eventTemplate, currentSecretKeyBytes);

      // نشر الحدث على الـ Relays
      const pool = new NostrTools.SimplePool();
      await Promise.any(pool.publish(RELAYS, signedEvent));

      alert('تم نشر وتحديث ملفك الشخصي بنجاح على شبكة Nostr!');
      pool.close(RELAYS);
    } catch (e) {
      alert('حدث خطأ أثناء النشر: ' + e.message);
    } finally {
      btn.innerText = 'حفظ ونشر التغيرات على الشبكة 🚀';
      btn.disabled = false;
    }
  });

  // استعادة الجلسة
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('kalimat_nsec');
    if (saved) performLogin(saved);
  });
</script>

</body>
</html>
