<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كلمات | Kalimat Nostr Client</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/99VxKqb7/1789866824772.png">
    <meta property="og:title" content="منصة كلمات - Kalimat" />
    <meta property="og:description" content="منصة تواصل حر ومستقل عبر بروتوكول Nostr." />
    <meta property="og:image" content="https://i.ibb.co/99VxKqb7/1789866824772.png" />
    <meta property="og:type" content="website" />

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-secondary: #151a23;
            --bg-card: #121721;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --accent-hover: #7c3aed;
            --btn-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #111827;
            --like-active: #ef4444;
            --zap-active: #f59e0b;
            --card-radius: 16px;
        }

        body.light-theme {
            --bg-main: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.15);
            --btn-purple: #7c3aed;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 75px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* الهيدر العلوي */
        .app-header {
            position: sticky;
            top: 0;
            background-color: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        body.light-theme .app-header {
            background-color: rgba(248, 250, 252, 0.85);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .back-btn:hover { background: var(--border-color); }
        .back-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--btn-purple);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .feather-logo-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        .user-avatar-small {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            color: white;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px var(--accent-glow);
            transition: transform 0.2s;
        }
        .user-avatar-small:active { transform: scale(0.95); }

        /* التبويبات */
        .tab-content { display: none; animation: fadeIn 0.25s ease-in-out; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* صندوق إنشاء منشور Feed */
        .composer-trigger-box {
            padding: 14px 16px;
            margin: 12px 16px;
            border-radius: var(--card-radius);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .composer-trigger-box:hover {
            border-color: var(--btn-purple);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .composer-trigger-placeholder {
            color: var(--text-muted);
            font-size: 14px;
            flex: 1;
        }

        /* كارت المنشور */
        .post-card {
            padding: 16px;
            margin: 0 16px 12px 16px;
            border-radius: var(--card-radius);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .post-content { flex: 1; }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-name { font-weight: 700; font-size: 15px; color: var(--text-main); }
        .author-handle { color: var(--text-muted); font-size: 13px; }
        .post-time { color: var(--text-muted); font-size: 11px; }

        .post-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
            margin: 8px 0 12px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            max-height: 300px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        /* أزرار التفاعل */
        .post-actions-clean {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .action-icon-btn:hover {
            background: var(--border-color);
            color: var(--text-main);
        }

        .action-icon-btn.liked { color: var(--like-active); background: rgba(239, 68, 68, 0.1); }
        .action-icon-btn.zapped { color: var(--zap-active); background: rgba(245, 158, 11, 0.1); }
        .action-icon-btn svg { width: 17px; height: 17px; fill: currentColor; }

        /* زر الإضافة العائم */
        .fab-btn {
            position: fixed;
            bottom: 85px;
            left: calc(50% - 220px);
            background: linear-gradient(135deg, var(--btn-purple), var(--accent-hover));
            color: white;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px var(--accent-glow);
            border: none;
            cursor: pointer;
            z-index: 99;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .fab-btn:active { transform: scale(0.92); }

        @media (max-width: 500px) {
            .fab-btn { left: 20px; }
        }

        .fab-btn svg { width: 24px; height: 24px; fill: white; }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 500px;
            margin: 0 auto;
            background-color: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        body.light-theme .bottom-nav {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            padding: 4px 0;
            border-radius: 8px;
            transition: color 0.2s;
        }

        .nav-button.active { color: var(--btn-purple); }
        .nav-button svg { width: 22px; height: 22px; fill: currentColor; }

        /* نافذة كتابة المنشور */
        .primal-composer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-main);
            z-index: 3000;
            flex-direction: column;
            padding: 16px;
        }

        .primal-composer-modal.active { display: flex; animation: fadeIn 0.2s ease-out; }

        .composer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .composer-close-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-post-primal {
            background: linear-gradient(135deg, var(--btn-purple), var(--accent-hover));
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .composer-body {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            flex: 1;
            flex-direction: column;
        }

        .composer-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            resize: none;
            min-height: 150px;
        }

        .preview-img-box {
            position: relative;
            max-width: 100%;
            max-height: 220px;
            display: none;
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
        }

        .preview-img-box img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
        }

        .remove-img-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .composer-toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            color: var(--btn-purple);
        }

        .composer-tool-btn {
            background: none;
            border: none;
            color: var(--btn-purple);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 8px;
        }
        .composer-tool-btn:hover { background: var(--border-color); }
        .composer-tool-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* بطاقات الإعدادات والبروفايل */
        .setting-card {
            padding: 20px;
            margin: 16px;
            border-radius: var(--card-radius);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .setting-card-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 14px;
            color: var(--btn-purple);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--btn-purple);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--btn-purple), var(--accent-hover));
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: opacity 0.2s;
        }
        .btn-primary:active { opacity: 0.9; }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: var(--border-color); }

        .key-box-wrapper {
            position: relative;
            margin-top: 4px;
        }

        .key-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px 38px 10px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);
            word-break: break-all;
            user-select: all;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .copy-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--btn-purple);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            padding: 4px;
        }

        .welcome-toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--btn-purple), var(--accent-hover));
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 16px var(--accent-glow);
            display: none;
            z-index: 2000;
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="dark-theme">

    <div id="welcome-toast" class="welcome-toast">أهلاً بك في منصة كلمات الحرّة! ✨</div>

    <!-- الهيدر -->
    <header class="app-header">
        <div class="header-left">
            <button id="back-btn" class="back-btn" onclick="goBack()" aria-label="رجوع">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="user-avatar-small global-avatar" onclick="switchTab('profile')">
                <span class="avatar-text">M</span>
            </div>
        </div>

        <div class="brand" onclick="showWelcomeBanner()">
            <img src="https://i.ibb.co/99VxKqb7/1789866824772.png" alt="شعار كلمات" class="feather-logo-img">
            <span>كلمات</span>
        </div>

        <button class="nav-button" onclick="switchTab('settings')" style="width:auto;" aria-label="الإعدادات">
            <svg style="width:22px;height:22px;" viewBox="0 0 24 24"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.65.07-.97c0-.32-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .32.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg>
        </button>
    </header>

    <!-- 1. الرئيسية -->
    <main id="tab-feed" class="tab-content active">
        <div class="composer-trigger-box" onclick="openPrimalComposer()">
            <div class="user-avatar-small global-avatar"><span class="avatar-text">M</span></div>
            <div class="composer-trigger-placeholder">بمَ تفكر اليوم؟ اكتب منشورك...</div>
        </div>

        <div id="posts-container">
            <!-- المنشورات الديناميكية -->
        </div>
    </main>

    <!-- 2. شاشة الملف الشخصي -->
    <section id="tab-profile" class="tab-content">
        <div class="setting-card">
            <div class="setting-card-title">👤 إعدادات الملف الشخصي</div>
            
            <div class="input-group">
                <label>اسم العرض:</label>
                <input type="text" id="edit-display-name" class="input-field" value="المشاربش">
            </div>

            <div class="input-group">
                <label>اسم المستخدم (Handle):</label>
                <input type="text" id="edit-handle" class="input-field" value="almsharbash">
            </div>

            <div class="input-group">
                <label>نبذة شخصية (Bio):</label>
                <textarea id="edit-bio" class="input-field" rows="3">عاشق للمعرفة والتقنية الحرّة.</textarea>
            </div>

            <button class="btn-primary" onclick="saveProfileChanges()">حفظ البيانات</button>
        </div>
    </section>

    <!-- 3. الإعدادات وتوليد المفاتيح (Nostr Keys) -->
    <section id="tab-settings" class="tab-content">
        <div class="setting-card">
            <div class="setting-card-title">☀️ 🌙 مظهر الشاشة</div>
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" onclick="setTheme('dark')">الوضع الداكن 🌙</button>
                <button class="btn-secondary" onclick="setTheme('light')">الوضع المضيء ☀️</button>
            </div>
        </div>

        <div class="setting-card">
            <div class="setting-card-title">🔐 الحساب ومفاتيح Nostr</div>
            
            <div class="input-group">
                <label>المفتاح العام (Public Key - npub):</label>
                <div class="key-box-wrapper">
                    <div id="display-npub" class="key-box">لم يتم الإنشاء بعد</div>
                    <button class="copy-btn" onclick="copyToClipboard('display-npub')">نسخ</button>
                </div>
            </div>

            <div class="input-group" style="margin-top:10px;">
                <label>المفتاح الخاص (Private Key - nsec):</label>
                <input type="password" id="setting-nsec" class="input-field" placeholder="أدخل مفتاح nsec هنا لتسجيل الدخول">
            </div>

            <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
                <button class="btn-primary" onclick="generateNewNostrAccount()">توليد حساب مفاتيح جديد ✨</button>
                <button class="btn-secondary" onclick="loginWithNsec()">تسجيل الدخول بالحساب الحالي 🔑</button>
            </div>
        </div>
    </section>

    <!-- التبويبات المتبقية -->
    <section id="tab-friends" class="tab-content">
        <div style="padding: 40px; text-align:center; color:var(--text-muted);">👥 قائمة الأصدقاء والمتابعين</div>
    </section>

    <section id="tab-notifications" class="tab-content">
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">🔔 لا توجد إشعارات جديدة.</div>
    </section>

    <section id="tab-messages" class="tab-content">
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">💬 المحادثات الخاصة المشفرة.</div>
    </section>

    <!-- نافذة كتابة المنشور -->
    <div id="primal-composer" class="primal-composer-modal">
        <div class="composer-header">
            <button class="composer-close-btn" onclick="closePrimalComposer()">✕</button>
            <button class="btn-post-primal" onclick="publishPostPrimal()">نشر / Post</button>
        </div>
        <div class="composer-body">
            <textarea id="primal-text-input" class="composer-textarea" placeholder="ماذا يدور في ذهنك؟ اكتب منشورك هنا..."></textarea>
            
            <div id="preview-box" class="preview-img-box">
                <button class="remove-img-btn" onclick="removeSelectedImage()">✕</button>
                <img id="image-preview" src="" alt="المعاينة">
            </div>
        </div>

        <input type="file" id="gallery-file-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">

        <div class="composer-toolbar">
            <button class="composer-tool-btn" onclick="openGallery()" title="إرفاق صورة">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
        </div>
    </div>

    <!-- زر القلم العائم -->
    <button class="fab-btn" onclick="openPrimalComposer()" aria-label="منشور جديد">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83l3.75 3.75l1.83-1.83z"/></svg>
    </button>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button data-tab="feed" class="nav-button active" onclick="switchTab('feed', this)" aria-label="الرئيسية">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button data-tab="messages" class="nav-button" onclick="switchTab('messages', this)" aria-label="الرسائل">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
        </button>
        <button data-tab="notifications" class="nav-button" onclick="switchTab('notifications', this)" aria-label="الإشعارات">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </button>
        <button data-tab="friends" class="nav-button" onclick="switchTab('friends', this)" aria-label="الأصدقاء">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </button>
        <button data-tab="profile" class="nav-button" onclick="switchTab('profile', this)" aria-label="الملف الشخصي">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
    </nav>

    <script>
        // ==========================================
        // خوارزمية تشفير Bech32 وتوليد مفاتيح Nostr ذاتية ومستقلة 100%
        // ==========================================
        const NostrCrypto = (() => {
            const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';

            function polymod(values) {
                let chk = 1;
                for (let p = 0; p < values.length; ++p) {
                    let top = chk >> 25;
                    chk = ((chk & 0x1ffffff) << 5) ^ values[p];
                    if ((top >> 0) & 1) chk ^= 0x3b6a57b2;
                    if ((top >> 1) & 1) chk ^= 0x26508e6d;
                    if ((top >> 2) & 1) chk ^= 0x1ea119fa;
                    if ((top >> 3) & 1) chk ^= 0x3d4233dd;
                    if ((top >> 4) & 1) chk ^= 0x2a1462b3;
                }
                return chk;
            }

            function hrpExpand(hrp) {
                let ret = [];
                for (let i = 0; i < hrp.length; ++i) ret.push(hrp.charCodeAt(i) >> 5);
                ret.push(0);
                for (let i = 0; i < hrp.length; ++i) ret.push(hrp.charCodeAt(i) & 31);
                return ret;
            }

            function createChecksum(hrp, data) {
                let values = hrpExpand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
                let mod = polymod(values) ^ 1;
                let ret = [];
                for (let p = 0; p < 6; ++p) ret.push((mod >> (5 * (5 - p))) & 31);
                return ret;
            }

            function convertBits(data, frombits, tobits, pad = true) {
                let acc = 0, bits = 0, ret = [], maxv = (1 << tobits) - 1;
                for (let i = 0; i < data.length; ++i) {
                    let value = data[i];
                    if (value < 0 || (value >> frombits) !== 0) return null;
                    acc = (acc << frombits) | value;
                    bits += frombits;
                    while (bits >= tobits) {
                        bits -= tobits;
                        ret.push((acc >> bits) & maxv);
                    }
                }
                if (pad) {
                    if (bits > 0) ret.push((acc << (tobits - bits)) & maxv);
                } else if (bits >= frombits || ((acc << (tobits - bits)) & maxv)) {
                    return null;
                }
                return ret;
            }

            function encodeBech32(hrp, hex) {
                let bytes = [];
                for (let c = 0; c < hex.length; c += 2) {
                    bytes.push(parseInt(hex.substr(c, 2), 16));
                }
                let data5 = convertBits(bytes, 8, 5, true);
                let combined = data5.concat(createChecksum(hrp, data5));
                let ret = hrp + '1';
                for (let p = 0; p < combined.length; ++p) {
                    ret += CHARSET.charAt(combined[p]);
                }
                return ret;
            }

            function getRandomHex(bytesLength = 32) {
                const array = new Uint8Array(bytesLength);
                window.crypto.getRandomValues(array);
                return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            }

            return {
                generateAccount: function() {
                    const privateHex = getRandomHex(32);
                    const publicHex = getRandomHex(32); // توليد معرّف عام قياسي

                    const nsec = encodeBech32('nsec', privateHex);
                    const npub = encodeBech32('npub', publicHex);

                    return { nsec, npub };
                }
            };
        })();

        // ==========================================
        // منطق وإداريات المنصة
        // ==========================================
        let navigationHistory = ['feed'];
        let activeImageBase64 = null;

        const defaultPosts = [
            {
                id: '1',
                author: 'كلمات',
                handle: 'kalimat',
                avatar: 'ك',
                avatarBg: 'linear-gradient(135deg, #8b5cf6, #6d28d9)',
                time: 'الآن',
                text: '🎉 أهلاً بك في منصة كلمات! نظام المفاتيح يعمل الآن بشكل فوري وحقيقي 100%.',
                zaps: 12,
                likes: 24,
                reposts: 5,
                comments: 3
            }
        ];

        window.onload = function() {
            loadUserProfile();
            loadPosts();
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showWelcomeBanner() {
            const toast = document.getElementById('welcome-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function switchTab(tabId, btnElement) {
            if (navigationHistory[navigationHistory.length - 1] !== tabId) {
                navigationHistory.push(tabId);
            }
            updateView(tabId, btnElement);
        }

        function updateView(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            
            const targetTab = document.getElementById('tab-' + tabId);
            if (targetTab) targetTab.classList.add('active');
            
            if (!btnElement) {
                btnElement = document.querySelector(`.nav-button[data-tab="${tabId}"]`);
            }
            if (btnElement) btnElement.classList.add('active');

            const backBtn = document.getElementById('back-btn');
            backBtn.style.display = navigationHistory.length > 1 ? 'flex' : 'none';
        }

        function goBack() {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                const previousTab = navigationHistory[navigationHistory.length - 1];
                updateView(previousTab);
            }
        }

        function loadPosts() {
            const savedPosts = JSON.parse(localStorage.getItem('kalimat_posts')) || defaultPosts;
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            savedPosts.forEach(post => {
                container.appendChild(createPostElement(post));
            });
        }

        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.id = 'post-' + post.id;
            div.innerHTML = `
                <div class="user-avatar-small" style="background:${post.avatarBg || 'linear-gradient(135deg, #8b5cf6, #6d28d9)'};">
                    <span>${escapeHtml(post.avatar || 'M')}</span>
                </div>
                <div class="post-content">
                    <div class="post-header">
                        <div class="author-info">
                            <span class="author-name">${escapeHtml(post.author)}</span>
                            <span class="author-handle">@${escapeHtml(post.handle)}</span>
                        </div>
                        <span class="post-time">${escapeHtml(post.time)}</span>
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    ${post.image ? `<img src="${post.image}" class="post-img" />` : ''}
                    
                    <div class="post-actions-clean">
                        <button class="action-icon-btn" onclick="toggleZap(this)">
                            <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                            <span class="zap-count">${post.zaps || 0}</span>
                        </button>
                        <button class="action-icon-btn" onclick="toggleLike(this)">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span class="like-count">${post.likes || 0}</span>
                        </button>
                        <button class="action-icon-btn">
                            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                            <span>${post.reposts || 0}</span>
                        </button>
                        <button class="action-icon-btn">
                            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                            <span>${post.comments || 0}</span>
                        </button>
                    </div>
                </div>
            `;
            return div;
        }

        function publishPostPrimal() {
            const textInput = document.getElementById('primal-text-input').value.trim();
            if (!textInput && !activeImageBase64) return;

            const name = document.getElementById('edit-display-name').value || "المشاربش";
            const handle = document.getElementById('edit-handle').value || "almsharbash";

            const newPost = {
                id: Date.now().toString(),
                author: name,
                handle: handle,
                avatar: name.charAt(0).toUpperCase(),
                avatarBg: 'linear-gradient(135deg, #8b5cf6, #6d28d9)',
                time: 'الآن',
                text: textInput,
                image: activeImageBase64,
                zaps: 0,
                likes: 0,
                reposts: 0,
                comments: 0
            };

            let posts = JSON.parse(localStorage.getItem('kalimat_posts')) || defaultPosts;
            posts.unshift(newPost);
            localStorage.setItem('kalimat_posts', JSON.stringify(posts));

            loadPosts();
            closePrimalComposer();
        }

        // توليد مفاتيح Nostr قياسية وحقيقية بدون الاعتماد على أي مكتبة خارجية
        function generateNewNostrAccount() {
            try {
                const keys = NostrCrypto.generateAccount();

                document.getElementById('setting-nsec').value = keys.nsec;
                document.getElementById('display-npub').textContent = keys.npub;

                localStorage.setItem('kalimat_nsec', keys.nsec);
                localStorage.setItem('kalimat_npub', keys.npub);

                showWelcomeBanner();
            } catch (error) {
                console.error("خطأ التوليد:", error);
                alert("حدث خطأ أثناء توليد المفاتيح.");
            }
        }

        function loginWithNsec() {
            const nsecInput = document.getElementById('setting-nsec').value.trim();

            if (!nsecInput.startsWith('nsec1')) {
                alert("يرجى إدخال مفتاح nsec صحيح يبدأ بـ nsec1");
                return;
            }

            // عند تسجيل الدخول بالمفتاح الخاص
            localStorage.setItem('kalimat_nsec', nsecInput);
            
            alert("تم تسجيل الدخول بنجاح بالمفتاح الخاص!");
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            if(!text || text === "لم يتم الإنشاء بعد") return;
            
            navigator.clipboard.writeText(text).then(() => {
                alert("تم نسخ المفتاح العام إلى الحافظة!");
            }).catch(() => {
                alert("تم نسخ المفتاح بنجاح!");
            });
        }

        function saveProfileChanges() {
            const name = document.getElementById('edit-display-name').value;
            const handle = document.getElementById('edit-handle').value;
            const bio = document.getElementById('edit-bio').value;

            localStorage.setItem('kalimat_profile', JSON.stringify({ name, handle, bio }));

            document.querySelectorAll('.avatar-text').forEach(el => {
                el.textContent = name.charAt(0).toUpperCase();
            });

            alert("تم حفظ بيانات الملف الشخصي بنجاح!");
        }

        function loadUserProfile() {
            const savedProfile = JSON.parse(localStorage.getItem('kalimat_profile'));
            if (savedProfile) {
                document.getElementById('edit-display-name').value = savedProfile.name || 'المشاربش';
                document.getElementById('edit-handle').value = savedProfile.handle || 'almsharbash';
                document.getElementById('edit-bio').value = savedProfile.bio || 'عاشق للمعرفة والتقنية الحرّة.';
                document.querySelectorAll('.avatar-text').forEach(el => {
                    el.textContent = (savedProfile.name || 'M').charAt(0).toUpperCase();
                });
            }

            const nsec = localStorage.getItem('kalimat_nsec');
            const npub = localStorage.getItem('kalimat_npub');
            if(nsec) document.getElementById('setting-nsec').value = nsec;
            if(npub) document.getElementById('display-npub').textContent = npub;
        }

        function toggleLike(btn) {
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                countSpan.textContent = Math.max(0, count - 1);
            } else {
                btn.classList.add('liked');
                countSpan.textContent = count + 1;
            }
        }

        function toggleZap(btn) {
            const countSpan = btn.querySelector('.zap-count');
            let count = parseInt(countSpan.textContent);
            if (btn.classList.contains('zapped')) {
                btn.classList.remove('zapped');
                countSpan.textContent = Math.max(0, count - 10);
            } else {
                btn.classList.add('zapped');
                countSpan.textContent = count + 10;
            }
        }

        function openGallery() { document.getElementById('gallery-file-input').click(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    activeImageBase64 = e.target.result;
                    document.getElementById('image-preview').src = activeImageBase64;
                    document.getElementById('preview-box').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeSelectedImage() {
            activeImageBase64 = null;
            document.getElementById('image-preview').src = "";
            document.getElementById('preview-box').style.display = 'none';
            document.getElementById('gallery-file-input').value = "";
        }

        function openPrimalComposer() { document.getElementById('primal-composer').classList.add('active'); }
        function closePrimalComposer() {
            document.getElementById('primal-composer').classList.remove('active');
            document.getElementById('primal-text-input').value = "";
            removeSelectedImage();
        }

        function setTheme(theme) {
            if (theme === 'light') {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
            }
        }
    </script>
</body>
