<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr Relay Reader</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background: #6200ee;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #3700b3; }
        #status {
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #888;
        }
        .event-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            word-break: break-word;
        }
        .event-header {
            font-size: 0.8em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .event-content {
            font-size: 1em;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h2>قارئ خوادم Nostr (Relay)</h2>
    
    <div class="controls">
        <input type="text" id="relayUrl" value="wss://relay.damus.io" placeholder="رابط الـ Relay">
        <button onclick="connectAndFetch()">اتصال وجلب الأحداث</button>
    </div>

    <div id="status">الحالة: غير متصل</div>
    <div id="eventsContainer"></div>

    <script>
        let ws = null;

        function connectAndFetch() {
            const relayUrl = document.getElementById('relayUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const container = document.getElementById('eventsContainer');

            // إغلاق أي اتصال سابق إذا كان مفتوحاً
            if (ws) {
                ws.close();
            }

            container.innerHTML = '';
            statusDiv.textContent = 'جاري الاتصال بـ ' + relayUrl + '...';

            try {
                // فتح اتصال WebSocket جديد
                ws = new WebSocket(relayUrl);

                ws.onopen = () => {
                    statusDiv.textContent = 'تم الاتصال بنجاح! جاري طلب الأحداث...';

                    // إرسال طلب جلب الأحداث (REQ)
                    // جلب آخر 15 منشور نصي (Kind 1)
                    const subscriptionId = "sub_" + Math.random().toString(36).substring(7);
                    const reqMessage = [
                        "REQ",
                        subscriptionId,
                        {
                            kinds: [1], // 1 تعني المنشورات النصية Text Notes
                            limit: 15  // عدد الأحداث المطلوبة
                        }
                    ];

                    ws.send(JSON.stringify(reqMessage));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const messageType = data[0]; // نوع الرسالة (EVENT, EOSE, NOTICE)

                    if (messageType === "EVENT") {
                        const eventData = data[2]; // تفاصيل الحدث
                        displayEvent(eventData);
                    } else if (messageType === "EOSE") {
                        statusDiv.textContent = 'تم اكتفاء الـ Relay واكتمال جلب البيانات (End of Stored Events).';
                    }
                };

                ws.onerror = (error) => {
                    statusDiv.textContent = 'حدث خطأ في الاتصال بالـ Relay.';
                    console.error("WebSocket Error:", error);
                };

                ws.onclose = () => {
                    console.log("تم إغلاق الاتصال.");
                };

            } catch (err) {
                statusDiv.textContent = 'الرابط غير صالح أو فشل الاتصال.';
                console.error(err);
            }
        }

        // دالة لعرض الحدث داخل الصفحة
        function displayEvent(eventData) {
            const container = document.getElementById('eventsContainer');

            const card = document.createElement('div');
            card.className = 'event-card';

            const date = new Date(eventData.created_at * 1000).toLocaleString('ar-EG');
            const pubkeyShort = eventData.pubkey.substring(0, 8) + "..." + eventData.pubkey.substring(eventData.pubkey.length - 8);

            card.innerHTML = `
                <div class="event-header">
                    <strong>الناشر:</strong> ${pubkeyShort} | <strong>التاريخ:</strong> ${date}
                </div>
                <div class="event-content">${escapeHtml(eventData.content)}</div>
            `;

            container.appendChild(card);
        }

        // دالة لتنظيف النص ومنع الهجمات (XSS)
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
