<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلمات - إدارة الحساب</title>
  <style>
    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1a1d2d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .field-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a5b5;
      margin-bottom: 6px;
    }
    .input-wrapper {
      display: flex;
      gap: 8px;
    }
    input {
      width: 100%;
      background-color: #0d0f17;
      border: 1px solid #2e344d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #7c5dfa;
    }
    .btn-copy {
      background-color: #252a3e;
      color: #8b92b0;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .btn-primary {
      width: 100%;
      background-color: #7c5dfa;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      font-size: 0.95rem;
    }
    .btn-secondary {
      width: 100%;
      background-color: transparent;
      border: 1px solid #3d4468;
      color: #b0b7d0;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #4cd964;
      text-align: center;
    }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 420px;">
    
    <div class="card">
      <h2>🔑 إدارة الحساب والمفاتيح</h2>
      
      <div class="field-group">
        <label>المفتاح العام (Public Key - npub):</label>
        <div class="input-wrapper">
          <input type="text" id="publicKey" placeholder="أدخل المفتاح العام npub1..." />
          <button type="button" class="btn-copy" id="btnCopyPub">نسخ</button>
        </div>
      </div>

      <div class="field-group">
        <label>المفتاح الخاص (Private Key - nsec):</label>
        <div class="input-wrapper">
          <input type="password" id="privateKey" placeholder="أدخل المفتاح الخاص nsec1..." />
          <button type="button" class="btn-copy" id="btnCopyPriv">نسخ</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btnGenerate">✨ توليد حساب جديد</button>
      <button type="button" class="btn-secondary" id="btnLogin">تسجيل الدخول والدخول للمنصة</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card">
      <h2>👤 تعديل الملف الشخصي</h2>
      
      <div class="field-group">
        <label>اسم العرض:</label>
        <input type="text" id="displayName" placeholder="مثال: أحمد" />
      </div>

      <div class="field-group">
        <label>اسم المستخدم (Handle):</label>
        <input type="text" id="handle" placeholder="مثال: ahmed_12" />
      </div>

      <div class="field-group">
        <label>رابط الصورة الشخصية (Avatar URL):</label>
        <input type="url" id="avatarUrl" placeholder="https://..." />
      </div>
    </div>

  </div>

  <script>
    // دالة إنشاء كود هكس عشوائي مستقل تماماً
    function generateRandomHex(length) {
      var characters = '0123456789abcdef';
      var result = '';
      for (var i = 0; i < length; i++) {
        result += characters.charAt(Math.floor(Math.random() * characters.length));
      }
      return result;
    }

    // توليد مفتاحين مستقلين عند الضغط
    document.getElementById('btnGenerate').onclick = function() {
      var privHex = generateRandomHex(64);
      var pubHex = generateRandomHex(64);

      document.getElementById('privateKey').value = 'nsec1' + privHex.substring(0, 58);
      document.getElementById('publicKey').value = 'npub1' + pubHex.substring(0, 58);

      showStatus('تم توليد الحساب والمفاتيح بنجاح!');
    };

    // تسجيل الدخول والحفظ
    document.getElementById('btnLogin').onclick = function() {
      var pub = document.getElementById('publicKey').value.trim();
      var priv = document.getElementById('privateKey').value.trim();

      if (!pub && !priv) {
        alert('يرجى إدخال المفتاح الخاص أو العام لتسجيل الدخول');
        return;
      }

      if (pub.indexOf('@') !== -1) {
        alert('المفتاح العام يجب أن يكون كود Nostr وليس بريداً إلكترونياً');
        return;
      }

      var userSession = {
        publicKey: pub,
        privateKey: priv,
        displayName: document.getElementById('displayName').value,
        handle: document.getElementById('handle').value,
        avatar: document.getElementById('avatarUrl').value
      };

      localStorage.setItem('user_session', JSON.stringify(userSession));
      showStatus('تم الحفظ وتسجيل الدخول بنجاح!');
    };

    // معالجة أزرار النسخ
    document.getElementById('btnCopyPub').onclick = function() {
      copyToClipboard('publicKey');
    };

    document.getElementById('btnCopyPriv').onclick = function() {
      copyToClipboard('privateKey');
    };

    function copyToClipboard(inputId) {
      var input = document.getElementById(inputId);
      if (!input.value) return alert('لا يوجد نص لنسخه');
      input.select();
      document.execCommand('copy');
      showStatus('تم النسخ إلى الحافظة!');
    }

    function showStatus(text) {
      var el = document.getElementById('statusMsg');
      el.innerText = text;
      setTimeout(function() { el.innerText = ''; }, 3000);
    }
  </script>
</body>
</html>
