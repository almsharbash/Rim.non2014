<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات</title>
    <style>
        :root {
            --bg-dark: #0e0e17;
            --card-dark: #161624;
            --input-dark: #1c1c2e;
            --accent-purple: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--bg-dark);
        }

        .top-left, .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
        }

        .top-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-purple);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #7c3aed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        /* Theme Selector */
        .theme-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px 16px;
        }

        .theme-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            color: var(--text-main);
        }

        .theme-card.active {
            border-color: #6366f1;
        }

        .theme-card-icon {
            margin-top: 8px;
            font-size: 18px;
        }

        /* Settings / Key Management Card */
        .setting-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin: 8px 16px;
            padding: 16px;
        }

        .setting-card-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-align: right;
        }

        .key-box-wrapper {
            display: flex;
            background-color: var(--input-dark);
            border-radius: 8px;
            overflow: hidden;
        }

        .key-box-input {
            width: 100%;
            background: none;
            border: none;
            padding: 10px;
            color: var(--text-muted);
            font-size: 13px;
            outline: none;
            text-align: left;
            direction: ltr;
        }

        .copy-btn {
            background: rgba(124, 58, 237, 0.2);
            border: none;
            color: #a78bfa;
            padding: 0 16px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-logout {
            width: 100%;
            background: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .status-badge {
            color: var(--success-color);
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            bottom: 75px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            cursor: pointer;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <div class="top-left">
                <button type="button" class="icon-btn">⚙️</button>
            </div>

            <div class="top-title">
                كلمات 🪶
            </div>

            <div class="top-right">
                <div class="user-avatar">K</div>
                <button type="button" class="icon-btn">←</button>
            </div>
        </header>

        <!-- Main Cards -->
        <main>
            <!-- Theme Cards -->
            <section class="theme-selector">
                <div class="theme-card">
                    <div>الوضع المضيء</div>
                    <div class="theme-card-icon">☀️</div>
                </div>
                <div class="theme-card active">
                    <div>الوضع الداكن</div>
                    <div class="theme-card-icon">🌙</div>
                </div>
            </section>

            <!-- Key Management Card -->
            <section class="setting-card">
                <div class="setting-card-title">🔑 إدارة المفاتيح والحساب</div>

                <div class="input-group">
                    <label>المفتاح العام (Public Key - npub):</label>
                    <div class="key-box-wrapper">
                        <button type="button" class="copy-btn" onclick="copyToClipboard('setting-npub')">نسخ</button>
                        <input type="text" id="setting-npub" class="key-box-input" readonly placeholder="620394eb473fd93d15f0cac1dfb5d1">
                    </div>
                </div>

                <div class="input-group" style="margin-top:12px;">
                    <label>المفتاح الخاص (Private Key - nsec):</label>
                    <div class="key-box-wrapper">
                        <button type="button" class="copy-btn" onclick="copyToClipboard('setting-nsec')">نسخ</button>
                        <input type="text" id="setting-nsec" class="key-box-input" placeholder="620394eb473fd93d15f0cac1dfb5d1">
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
                    <button type="button" class="btn-primary" onclick="generateNostrAccount(event)">توليد حساب جديد ✨</button>
                    <button type="button" class="btn-secondary" onclick="loginAndSaveKeys(event)">تسجيل الدخول بالمفتاح 🔑</button>
                    <button type="button" id="btn-logout" class="btn-logout" onclick="logoutNostrAccount(event)" style="display:none;">تسجيل الخروج 🚪</button>
                </div>

                <div id="login-status" class="status-badge" style="display:none;">
                    ✓ تم تسجيل الدخول وجلسة التوقيع نشطة
                </div>
            </section>
        </main>

        <!-- FAB Button -->
        <button type="button" class="fab-btn">✏️</button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item">👤</button>
            <button type="button" class="nav-item">👥</button>
            <button type="button" class="nav-item">🔔</button>
            <button type="button" class="nav-item">💬</button>
            <button type="button" class="nav-item">🏠</button>
        </nav>
    </div>

    <!-- Script Block -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedNsec = localStorage.getItem('kalimat_nsec');
            const savedNpub = localStorage.getItem('kalimat_npub');

            if (savedNsec && savedNpub) {
                document.getElementById('setting-nsec').value = savedNsec;
                document.getElementById('setting-npub').value = savedNpub;
                updateLoginUI(true);
            }
        });

        function generateNostrAccount(e) {
            if (e) e.preventDefault();

            const hexChars = '0123456789abcdef';
            let randomHex = '';
            for (let i = 0; i < 58; i++) {
                randomHex += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
            }

            const nsec = randomHex;
            const npub = randomHex;

            document.getElementById('setting-nsec').value = nsec;
            document.getElementById('setting-npub').value = npub;

            localStorage.setItem('kalimat_nsec', nsec);
            localStorage.setItem('kalimat_npub', npub);

            updateLoginUI(true);
        }

        function loginAndSaveKeys(e) {
            if (e) e.preventDefault();

            const nsecInput = document.getElementById('setting-nsec').value.trim();
            if (!nsecInput) {
                alert("يرجى إدخال المفتاح الخاص أولاً.");
                return;
            }

            document.getElementById('setting-npub').value = nsecInput;

            localStorage.setItem('kalimat_nsec', nsecInput);
            localStorage.setItem('kalimat_npub', nsecInput);

            updateLoginUI(true);
        }

        function logoutNostrAccount(e) {
            if (e) e.preventDefault();

            localStorage.removeItem('kalimat_nsec');
            localStorage.removeItem('kalimat_npub');

            document.getElementById('setting-nsec').value = '';
            document.getElementById('setting-npub').value = '';

            updateLoginUI(false);
        }

        function updateLoginUI(isLoggedIn) {
            const statusEl = document.getElementById('login-status');
            const logoutBtn = document.getElementById('btn-logout');

            if (isLoggedIn) {
                if (statusEl) statusEl.style.display = 'flex';
                if (logoutBtn) logoutBtn.style.display = 'block';
            } else {
                if (statusEl) statusEl.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        function copyToClipboard(inputId) {
            const inputEl = document.getElementById(inputId);
            if (!inputEl || !inputEl.value) return;

            navigator.clipboard.writeText(inputEl.value).then(() => {
                alert("تم النسخ إلى الحافظة بنجاح!");
            }).catch(err => {
                console.error("خطأ أثناء النسخ: ", err);
            });
        }
    </script>
</body>
</html>
