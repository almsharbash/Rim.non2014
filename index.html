<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واجهة منصة تواصل - Facebook Style</title>
  <style>
    /* ---------------- 1. التنسيقات العامة والمتغيرات ---------------- */
    :root {
      --primary-color: #1877f2;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #050505;
      --text-sub: #65676b;
      --border-color: #ced0d4;
      --hover-bg: #e4e6eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* ---------------- 2. الشريط العلوي (Navbar) ---------------- */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 56px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .nav-left, .nav-right, .nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      color: var(--primary-color);
      font-size: 26px;
      font-weight: bold;
      text-decoration: none;
    }

    .search-box input {
      background-color: var(--bg-color);
      border: none;
      padding: 10px 16px;
      border-radius: 50px;
      outline: none;
      width: 220px;
      font-size: 14px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--hover-bg);
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* ---------------- 3. تخطيط الصفحة الرئيسي (Grid/Flex) ---------------- */
    .main-container {
      margin-top: 70px;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
    }

    .sidebar {
      width: 25%;
      position: sticky;
      top: 70px;
      height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
    }

    .sidebar-item:hover {
      background-color: var(--hover-bg);
    }

    .feed {
      width: 48%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right-bar {
      width: 22%;
    }

    /* ---------------- 4. مربع إنشاء منشور (Create Post) ---------------- */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .create-post-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--hover-bg);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ccc;
    }

    .create-post-input {
      flex: 1;
      background-color: var(--bg-color);
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      text-align: right;
      color: var(--text-sub);
    }

    .create-post-bottom {
      display: flex;
      justify-content: space-around;
      padding-top: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .action-btn:hover {
      background-color: var(--hover-bg);
    }

    /* ---------------- 5. مربع المنشور (Post Feed) ---------------- */
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .post-author {
      font-weight: bold;
      font-size: 14px;
    }

    .post-time {
      font-size: 12px;
      color: var(--text-sub);
    }

    .post-content {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .post-image {
      width: 100%;
      height: 250px;
      background-color: #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .post-stats {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hover-bg);
    }

    .liked {
      color: var(--primary-color) !important;
    }

    /* تجاوب الشاشة (Responsive) للشاشات الصغيرة */
    @media (max-width: 900px) {
      .sidebar, .right-bar { display: none; }
      .feed { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 1. الشريط العلوي -->
  <header class="navbar">
    <div class="nav-left">
      <a href="#" class="logo">facebook</a>
      <div class="search-box">
        <input type="text" placeholder="بحث في فيسبوك...">
      </div>
    </div>

    <div class="nav-right">
      <button class="icon-btn">💬</button>
      <button class="icon-btn">🔔</button>
      <div class="avatar"></div>
    </div>
  </header>

  <!-- 2. جسم الصفحة -->
  <div class="main-container">

    <!-- القائمة الجانبية اليسرى -->
    <aside class="sidebar">
      <a href="#" class="sidebar-item">
        <div class="avatar" style="width:36px; height:36px;"></div>
        <span>اسم المستخدم</span>
      </a>
      <a href="#" class="sidebar-item">👥 <span>الأصدقاء</span></a>
      <a href="#" class="sidebar-item">👨‍👩‍👧‍👦 <span>المجموعات</span></a>
      <a href="#" class="sidebar-item">🏪 <span>Marketplace</span></a>
      <a href="#" class="sidebar-item">📺 <span>Watch</span></a>
    </aside>

    <!-- التغذية الإخبارية (الوسط) -->
    <main class="feed">

      <!-- مربع إنشاء منشور -->
      <div class="card">
        <div class="create-post-top">
          <div class="avatar"></div>
          <button class="create-post-input">بم تفكر يا صديقي؟</button>
        </div>
        <div class="create-post-bottom">
          <button class="action-btn">🎥 فيديو مباشر</button>
          <button class="action-btn">🖼️ صورة/فيديو</button>
          <button class="action-btn">😊 شعور/نشاط</button>
        </div>
      </div>

      <!-- منشور 1 -->
      <article class="card">
        <div class="post-header">
          <div class="avatar"></div>
          <div>
            <div class="post-author">محمد أحمد</div>
            <div class="post-time">منذ 15 دقيقة</div>
          </div>
        </div>

        <div class="post-content">
          مرحباً بكم! هذه واجهة تجريبية لمنصة تواصل اجتماعي مجهزة باستخدام HTML و CSS و JavaScript فقط.
        </div>

        <div class="post-image">
          [ مساحة مخصصة لصورة المنشور ]
        </div>

        <div class="post-stats">
          <span>👍 42 تفاعل</span>
          <span>5 تعليقات</span>
        </div>

        <div class="create-post-bottom" style="border-top: 1px solid var(--hover-bg); margin-top: 8px;">
          <button class="action-btn like-btn" onclick="toggleLike(this)">👍 أعجبني</button>
          <button class="action-btn">💬 تعليق</button>
          <button class="action-btn">↪️ مشاركة</button>
        </div>
      </article>

    </main>

    <!-- القائمة الجانبية اليمنى (الإعلانات أو جهات الاتصال) -->
    <aside class="right-bar">
      <div class="card">
        <h4 style="color: var(--text-sub); margin-bottom: 10px;">جهات الاتصال</h4>
        <div class="sidebar-item">
          <div class="avatar" style="width:28px; height:28px;"></div>
          <span>أحمد علي</span>
        </div>
        <div class="sidebar-item">
          <div class="avatar" style="width:28px; height:28px;"></div>
          <span>سارة محمود</span>
        </div>
      </div>
    </aside>

  </div>

  <!-- 3. كود التفاعلات البسيطة (JavaScript) -->
  <script>
    function toggleLike(btn) {
      btn.classList.toggle('liked');
      if (btn.classList.contains('liked')) {
        btn.innerHTML = '💙 تم الإعجاب';
      } else {
        btn.innerHTML = '👍 أعجبني';
      }
    }
  </script>

</body>
</html>
