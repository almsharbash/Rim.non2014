<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات | Kalimat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-box {
            display: inline-block;
            background: #ffffff;
            padding: 8px;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(10, 58, 110, 0.12);
            margin-bottom: 12px;
        }

        .logo-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            border-radius: 16px;
            display: block;
        }

        .app-title {
            color: #0d47a1;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .app-desc {
            color: #555;
            font-size: 15px;
            max-width: 320px;
            line-height: 1.5;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #1557b0;
        }

        .forgot-pass {
            display: block;
            text-align: center;
            margin: 15px 0;
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #1b5e20;
        }

        .footer-text {
            margin-top: 25px;
            color: #666;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- الهيدر والشعار -->
    <div class="header-container">
        <div class="logo-box">
            <img src="https://i.ibb.co/99VxKqb7/1789866824772.png" alt="كلمات" class="logo-img">
        </div>
        <h1 class="app-title">كلمات</h1>
        <p class="app-desc">تواصل مع الأصدقاء والعالم من حولك عبر المنصة في مكان واحد.</p>
    </div>

    <!-- كارت تسجيل الدخول -->
    <div class="card">
        <form id="loginForm" onsubmit="event.preventDefault(); alert('تم الضغط على تسجيل الدخول');">
            <div class="form-group">
                <input type="text" class="input-field" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
            </div>
            <div class="form-group">
                <input type="password" class="input-field" placeholder="كلمة السر" required>
            </div>
            <button type="submit" class="btn-primary">تسجيل الدخول</button>
        </form>

        <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>

        <div class="divider"></div>

        <button class="btn-secondary" onclick="alert('انتقال لإنشاء حساب جديد')">إنشاء حساب جديد</button>
    </div>

    <div class="footer-text">
        أنشئ صفحة لشخصية عامة أو علامة تجارية أو عمل تجاري.
    </div>

</body>
</html>
