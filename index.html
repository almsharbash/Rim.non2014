<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - منصة التواصل</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-dark: #181b29;
            --input-dark: #111422;
            --accent-purple: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .top-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-purple);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
        }

        /* Theme Selector */
        .theme-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .theme-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-card.active {
            border-color: var(--accent-purple);
        }

        .theme-card-icon {
            font-size: 20px;
            margin-top: 6px;
        }

        /* Settings Card */
        .setting-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin: 12px 16px;
            padding: 18px;
        }

        .setting-card-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .key-box-wrapper {
            display: flex;
            background-color: var(--input-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .key-box-input {
            width: 100%;
            background: none;
            border: none;
            padding: 10px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .copy-btn {
            background: rgba(139, 92, 246, 0.2);
            border: none;
            color: var(--accent-purple);
            padding: 0 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-danger {
            width: 100%;
            background: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .status-badge {
            color: var(--success-color);
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* Floating Action Button */
        .fab-btn {
            position: fixed;
            bottom: 75px;
            left: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: var(--accent-purple);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            cursor: pointer;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-purple);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <button type="button" class="icon-btn">⚙️</button>
            <div class="top-title">
                كلمات 🪶
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="user-avatar" id="header-avatar">K</div>
                <button type="button" class="icon-btn">←</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            
            <!-- Theme Mode Cards -->
            <section class="theme-selector">
                <div class="theme-card">
                    <div>الوضع المضيء</div>
                    <div class="theme-card-icon">☀️</div>
                </div>
                <div class="theme-card active">
                    <div>الوضع الداكن</div>
                    <div class="theme-card-icon">🌙</div>
                </div>
            </section>

            <!-- Key & Account Management Section -->
            <section class="setting-card">
                <div class="setting-card-title">🔑 إدارة المفاتيح والحساب</div>

                <div class="input-group">
                    <label>المفتاح العام (Public Key - npub):</label>
                    <div class="key-box-wrapper">
                        <input type="text" id="setting-npub" class="key-box-input" readonly placeholder="سيظهر المفتاح العام هنا...">
                        <button type="button" class="copy-btn" onclick="copyToClipboard('setting-npub')">نسخ</button>
                    </div>
                </div>

                <div class="input-group" style="margin-top:12px;">
                    <label>المفتاح الخاص (Private Key - nsec):</label>
                    <div class="key-box-wrapper">
                        <input type="password" id="setting-nsec" class="key-box-input" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
                        <button type="button" class="copy-btn" onclick="copyToClipboard('setting-nsec')">نسخ</button>
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
                    <button type="button" class="btn-primary" onclick="generateNostrAccount(event)">توليد حساب جديد ✨</button>
                    <button type="button" class="btn-secondary" onclick="loginAndSaveKeys(event)">تسجيل الدخول بالمفتاح 🔑</button>
                    <button type="button" id="btn-logout" class="btn-danger" onclick="logoutNostrAccount(event)" style="display:none;">تسجيل الخروج 🚪</button>
                </div>

                <div id="login-status" class="status-badge" style="display:none;">
                    ✓ تم تسجيل الدخول وجلسة التوقيع نشطة
                </div>
            </section>

        </main>

        <!-- Floating Action Button -->
        <button type="button" class="fab-btn">✏️</button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item">🏠</button>
            <button type="button" class="nav-item">💬</button>
            <button type="button" class="nav-item">🔔</button>
            <button type="button" class="nav-item">👥</button>
            <button type="button" class="nav-item active">👤</button>
        </nav>
    </div>

    <!-- Application Script -->
    <script>
        // Check local storage on initial load
        document.addEventListener('DOMContentLoaded', () => {
            const savedNsec = localStorage.getItem('kalimat_nsec');
            const savedNpub = localStorage.getItem('kalimat_npub');

            if (savedNsec && savedNpub) {
                document.getElementById('setting-nsec').value = savedNsec;
                document.getElementById('setting-npub').value = savedNpub;
                updateLoginUI(true);
            }
        });

        // Function to generate new keypair
        function generateNostrAccount(e) {
            if (e) e.preventDefault();

            const hexChars = '0123456789abcdef';
            let randomHex = '';
            for (let i = 0; i < 58; i++) {
                randomHex += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
            }

            const nsec = 'nsec1' + randomHex;
            const npub = 'npub1' + randomHex;

            document.getElementById('setting-nsec').value = nsec;
            document.getElementById('setting-npub').value = npub;

            localStorage.setItem('kalimat_nsec', nsec);
            localStorage.setItem('kalimat_npub', npub);

            updateLoginUI(true);
            alert("تم توليد مفاتيح Nostr جديدة وتخزينها بنجاح! ✨");
        }

        // Function to login using manual key input
        function loginAndSaveKeys(e) {
            if (e) e.preventDefault();

            const nsecInput = document.getElementById('setting-nsec').value.trim();
            if (!nsecInput) {
                alert("يرجى إدخال أو توليد المفتاح الخاص أولاً.");
                return;
            }

            let npub = 'npub1' + (nsecInput.startsWith('nsec1') ? nsecInput.substring(5) : nsecInput);
            document.getElementById('setting-npub').value = npub;

            localStorage.setItem('kalimat_nsec', nsecInput);
            localStorage.setItem('kalimat_npub', npub);

            updateLoginUI(true);
            alert("تم تسجيل الدخول بنجاح! 🔑");
        }

        // Function to log out
        function logoutNostrAccount(e) {
            if (e) e.preventDefault();

            localStorage.removeItem('kalimat_nsec');
            localStorage.removeItem('kalimat_npub');

            document.getElementById('setting-nsec').value = '';
            document.getElementById('setting-npub').value = '';

            updateLoginUI(false);
            alert("تم تسجيل الخروج بنجاح.");
        }

        // Toggle UI elements based on auth status
        function updateLoginUI(isLoggedIn) {
            const statusEl = document.getElementById('login-status');
            const logoutBtn = document.getElementById('btn-logout');

            if (isLoggedIn) {
                if (statusEl) statusEl.style.display = 'flex';
                if (logoutBtn) logoutBtn.style.display = 'block';
            } else {
                if (statusEl) statusEl.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        // Helper to copy key text
        function copyToClipboard(inputId) {
            const inputEl = document.getElementById(inputId);
            if (!inputEl || !inputEl.value) return;

            navigator.clipboard.writeText(inputEl.value).then(() => {
                alert("تم النسخ إلى الحافظة بنجاح!");
            }).catch(err => {
                console.error("خطأ أثناء النسخ: ", err);
            });
        }
    </script>
</body>
</html>
