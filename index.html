<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalimat | كلمات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #1877f2;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #050505;
      --text-secondary: #65676b;
      --border-color: #ced0d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .logo {
      color: var(--primary-color);
      font-size: 22px;
      font-weight: bold;
    }

    .search-box {
      background: #f0f2f5;
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      width: 120px;
    }

    .main-container {
      max-width: 600px;
      margin: 15px auto;
      padding: 0 10px;
    }

    .create-post {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .post-input-container {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 15px;
      resize: none;
      outline: none;
      height: 40px;
    }

    .btn-publish {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .post-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .post-header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .post-author {
      font-weight: bold;
    }

    .post-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .post-content {
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.4;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
    }

    .nav-item {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">كلمات</div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="بحث..." onkeyup="filterPosts()">
    </div>
  </header>

  <div class="main-container">
    <div class="create-post">
      <div class="post-input-container">
        <div class="avatar" id="userAvatar">ع</div>
        <textarea id="postContent" placeholder="بم تفكر؟"></textarea>
      </div>
      <button class="btn-publish" onclick="submitPost()">نشر</button>
    </div>

    <div id="postsFeed">
      <!-- ستظهر المنشورات الحقيقية هنا مباشرة من Firebase -->
    </div>
  </div>

  <div class="nav-bar">
    <a href="#" class="nav-item active"><i class="fas fa-home fa-lg"></i>الرئيسية</a>
    <a href="#" class="nav-item"><i class="fas fa-user-friends fa-lg"></i>الأصدقاء</a>
    <a href="#" class="nav-item"><i class="fas fa-comments fa-lg"></i>الدردشة</a>
    <a href="#" class="nav-item"><i class="fas fa-user fa-lg"></i>حسابي</a>
  </div>

  <!-- Firebase Web SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBznOsrwmvtWDFKTbqz3bFry94J7hJFn0c",
      authDomain: "gogo1982-2026.firebaseapp.com",
      databaseURL: "https://gogo1982-2026-default-rtdb.firebaseio.com",
      projectId: "gogo1982-2026",
      storageBucket: "gogo1982-2026.firebasestorage.app",
      messagingSenderId: "79409104235",
      appId: "1:79409104235:web:5d7ad5dcda013b32f6f82e",
      measurementId: "G-5V553NQLDK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // دالة نشر منشور جديد في Firebase
    window.submitPost = function() {
      const textInput = document.getElementById('postContent');
      const text = textInput.value.trim();

      if (text !== "") {
        const postsRef = ref(db, 'posts');
        push(postsRef, {
          author: "مستخدم كلمات",
          content: text,
          timestamp: Date.now()
        }).then(() => {
          textInput.value = '';
        }).catch((error) => {
          alert("خطأ في النشر: " + error.message);
        });
      }
    };

    // الاستماع المباشر وجلب كافة المنشورات الحقيقية
    const postsRef = ref(db, 'posts');
    onValue(postsRef, (snapshot) => {
      const postsFeed = document.getElementById('postsFeed');
      postsFeed.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        const postsArray = Object.values(data).reverse();
        postsArray.forEach(post => {
          const postElement = document.createElement('div');
          postElement.className = 'post-card';
          postElement.innerHTML = `
            <div class="post-header">
              <div class="avatar">${post.author ? post.author.charAt(0) : 'م'}</div>
              <div>
                <div class="post-author">${post.author || "مستخدم"}</div>
                <div class="post-time">${new Date(post.timestamp).toLocaleTimeString('ar-EG')}</div>
              </div>
            </div>
            <div class="post-content">${post.content}</div>
          `;
          postsFeed.appendChild(postElement);
        });
      } else {
        postsFeed.innerHTML = '<p style="text-align:center; color:gray;">لا توجد منشورات حتى الآن. كن أول من ينشر!</p>';
      }
    });

    // دالة التصفية عند البحث
    window.filterPosts = function() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const posts = document.querySelectorAll('.post-card');
      posts.forEach(post => {
        const text = post.innerText.toLowerCase();
        post.style.display = text.includes(query) ? 'block' : 'none';
      });
    };
  </script>
</body>
</html>
