<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلمات - Kalimat</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #18132a;
            --input-bg: #221b3b;
            --primary: #8b5cf6;
            --text-color: #ffffff;
            --text-muted: #a0a0b8;
            --border-color: #2e264a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            display: flex;
            gap: 6px;
        }

        input, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-copy {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        #appView {
            display: none;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. واجهة التسجيل / الإعدادات -->
    <div id="loginView">
        <div class="card" style="margin-bottom: 15px;">
            <div class="section-title">🔑 إدارة الحساب والمفاتيح</div>
            
            <div class="form-group">
                <label>المفتاح العام (Public Key - npub):</label>
                <div class="input-wrapper">
                    <input type="text" id="publicKeyInput" placeholder="سيظهر المفتاح العام هنا...">
                    <button type="button" class="btn-copy" onclick="copyField('publicKeyInput')">نسخ</button>
                </div>
            </div>

            <div class="form-group">
                <label>المفتاح الخاص (Private Key - nsec):</label>
                <div class="input-wrapper">
                    <input type="text" id="privateKeyInput" placeholder="أدخل المفتاح الخاص لتسجيل الدخول...">
                    <button type="button" class="btn-copy" onclick="copyField('privateKeyInput')">نسخ</button>
                </div>
            </div>

            <button type="button" class="btn-primary" onclick="generateNewAccount()">توليد حساب جديد ✨</button>
            <button type="button" class="btn-secondary" onclick="loginWithPrivateKey()">الدخول إلى المنصة 🚀</button>
        </div>

        <div class="card">
            <div class="section-title">👤 تعديل الملف الشخصي</div>

            <div class="form-group">
                <label>اسم العرض:</label>
                <input type="text" id="displayNameInput" placeholder="أدخل اسم العرض">
            </div>

            <div class="form-group">
                <label>اسم المستخدم (Handle):</label>
                <input type="text" id="handleInput" placeholder="username">
            </div>

            <div class="form-group">
                <label>رابط الصورة الشخصية (Picture URL):</label>
                <input type="url" id="pictureUrlInput" placeholder="https://example.com/avatar.jpg">
            </div>

            <div class="form-group">
                <label>نبذة شخصية (Bio):</label>
                <textarea id="bioInput" rows="3" placeholder="اكتب نبذة عنك..."></textarea>
            </div>

            <button type="button" class="btn-primary" onclick="saveProfileChanges()">حفظ التغيرات والدخول</button>
        </div>
    </div>

    <!-- 2. واجهة المنصة الرئيسية -->
    <div id="appView">
        <div class="card">
            <div class="section-title" style="justify-content: space-between;">
                <span>🌐 منصة كلمات</span>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-secondary" style="width: auto; padding: 4px 10px; margin: 0;" onclick="openSettings()">الإعدادات</button>
                    <button class="btn-secondary" style="width: auto; padding: 4px 10px; margin: 0; color: #ef4444; border-color: #ef4444;" onclick="logout()">خروج</button>
                </div>
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem;">أهلاً بك <b id="userDisplayName" style="color: var(--primary);">kalimag</b> في شبكة Nostr!</p>
            
            <div class="form-group">
                <textarea id="newPostInput" rows="3" placeholder="ماذا يدور في ذهنك اليوم؟"></textarea>
            </div>
            <button class="btn-primary" onclick="publishPost()">نشر في الشبكة ✍️</button>
        </div>

        <div class="section-title" style="margin-top: 15px;">📜 التغذية والأحداث الأخيرة</div>
        <div id="feedContainer">
            <div class="post-card">
                <b>كلمات Bot 🤖</b>
                <p style="margin: 8px 0 0 0; color: var(--text-muted);">مرحباً بك في المنصة! حسابك متصل وجاهز لنشر وتصفح المنشورات.</p>
            </div>
        </div>
    </div>

</div>

<script>
  function bufToHex(buffer) {
      return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function copyField(elementId) {
      const input = document.getElementById(elementId);
      if (!input || !input.value) return alert('لا يوجد نص لنسخه!');
      navigator.clipboard.writeText(input.value).then(() => alert('تم النسخ بنجاح!'));
  }

  function generateNewAccount() {
      const skHex = bufToHex(window.crypto.getRandomValues(new Uint8Array(32)));
      const pkHex = bufToHex(window.crypto.getRandomValues(new Uint8Array(32)));
      const nsec = 'nsec1' + skHex;
      const npub = 'npub1' + pkHex;

      localStorage.setItem('nostr_nsec', nsec);
      localStorage.setItem('nostr_npub', npub);

      document.getElementById('publicKeyInput').value = npub;
      document.getElementById('privateKeyInput').value = nsec;
  }

  function loginWithPrivateKey() {
      const val = document.getElementById('privateKeyInput').value.trim();
      if (!val) return alert('يرجى إدخال المفتاح الخاص أولاً.');

      const nsec = val.startsWith('nsec') ? val : 'nsec1' + val;
      const npub = localStorage.getItem('nostr_npub') || ('npub1' + bufToHex(window.crypto.getRandomValues(new Uint8Array(32))));

      localStorage.setItem('nostr_nsec', nsec);
      localStorage.setItem('nostr_npub', npub);
      localStorage.setItem('is_logged_in', 'true');

      showAppView();
  }

  function saveProfileChanges() {
      const profileData = {
          name: document.getElementById('displayNameInput').value || 'kalimag',
          username: document.getElementById('handleInput').value,
          picture: document.getElementById('pictureUrlInput').value,
          about: document.getElementById('bioInput').value
      };

      localStorage.setItem('nostr_profile', JSON.stringify(profileData));
      localStorage.setItem('is_logged_in', 'true');
      showAppView();
  }

  function showAppView() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';

      const savedProfile = localStorage.getItem('nostr_profile');
      if (savedProfile) {
          try {
              const p = JSON.parse(savedProfile);
              if (p.name) document.getElementById('userDisplayName').innerText = p.name;
          } catch(e){}
      }
  }

  function openSettings() {
      document.getElementById('appView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
  }

  function logout() {
      localStorage.removeItem('is_logged_in');
      document.getElementById('appView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
  }

  function publishPost() {
      const txt = document.getElementById('newPostInput').value.trim();
      if (!txt) return;

      const feed = document.getElementById('feedContainer');
      const savedProfile = JSON.parse(localStorage.getItem('nostr_profile') || '{}');
      const name = savedProfile.name || 'kalimag';

      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      postDiv.innerHTML = `<b>${name}</b><p style="margin: 8px 0 0 0;">${txt}</p>`;
      
      feed.prepend(postDiv);
      document.getElementById('newPostInput').value = '';
  }

  // التوجيه المباشر عند فتح الرابط
  window.addEventListener('DOMContentLoaded', () => {
      const savedNpub = localStorage.getItem('nostr_npub');
      const savedNsec = localStorage.getItem('nostr_nsec');
      if (savedNpub) document.getElementById('publicKeyInput').value = savedNpub;
      if (savedNsec) document.getElementById('privateKeyInput').value = savedNsec;

      const savedProfile = localStorage.getItem('nostr_profile');
      if (savedProfile) {
          try {
              const p = JSON.parse(savedProfile);
              if (p.name) document.getElementById('displayNameInput').value = p.name;
              if (p.username) document.getElementById('handleInput').value = p.username;
              if (p.picture) document.getElementById('pictureUrlInput').value = p.picture;
              if (p.about) document.getElementById('bioInput').value = p.about;
          } catch(e){}
      }

      // الدخول التلقائي للمنصة عند وجود جلسة مسجلة
      if (localStorage.getItem('is_logged_in') === 'true' || savedNsec) {
          showAppView();
      }
  });
</script>

</body>
</html>
